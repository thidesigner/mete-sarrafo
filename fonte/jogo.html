<title>Jogo de Pergunta: Modo Festa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tela de quadra, um celular como juiz. Uma tela por momento do jogo, botões grandes para usar em pé e correndo.
   Visual de tema único (quadra azul à noite), escolhido de propósito: fica igual no claro e no escuro. */
:root {
  --court: #0f3057;
  --court-2: #133a68;
  --panel: #18487f;
  --chalk: #f4f7fb;
  --chalk-dim: #b8c6da;
  --lines: rgba(244, 247, 251, .22);
  --ball: #ff8a1f;
  --ball-ink: #2a1300;
  --hit: #ff4d6d;
  --ok: #37d99a;
  --coin: #ffd23f;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--court);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 118px, var(--lines) 119px 121px, transparent 122px),
    linear-gradient(90deg, transparent calc(50% - 1px), var(--lines) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px));
  background-attachment: fixed;
  color: var(--chalk);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; line-height: 1.05; text-wrap: balance; }
h1 { font-size: clamp(34px, 11vw, 52px); }
h1 em { font-style: normal; color: var(--ball); }
h2 { font-size: clamp(24px, 7vw, 32px); }
h3 { font-size: 18px; }
p { margin: 0; }
.dim { color: var(--chalk-dim); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); }
.card { background: var(--court-2); border: 2px solid var(--lines); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.hot { border-color: var(--ball); }
button { font: inherit; cursor: pointer; color: inherit; }
.btn {
  font-family: var(--display); font-size: 18px; letter-spacing: .02em; min-height: 56px; padding: 12px 18px;
  border-radius: 12px; border: 0; background: var(--ball); color: var(--ball-ink); width: 100%;
  box-shadow: 0 4px 0 #b85800;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b85800; }
.btn.ok { background: var(--ok); color: #03281a; box-shadow: 0 4px 0 #1c8c60; }
.btn.no { background: var(--hit); color: #2b0009; box-shadow: 0 4px 0 #a32741; }
.btn.ghost { background: transparent; color: var(--chalk); border: 2px solid var(--lines); box-shadow: none; }
.btn.small { min-height: 44px; font-size: 15px; padding: 8px 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input, select, textarea {
  font: inherit; font-size: 17px; color: var(--chalk); background: var(--court); border: 2px solid var(--lines);
  border-radius: 10px; padding: 12px; width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--coin); outline-offset: 2px; }
label { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk-dim); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--panel); border: 2px solid var(--lines); font-weight: 700; }
.chip button { background: none; border: 0; color: var(--chalk-dim); font-size: 18px; line-height: 1; padding: 0 2px; }
.chip.pick { cursor: pointer; }
.chip.pick[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.seat { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); }
.word { font-family: var(--display); font-size: clamp(28px, 9vw, 44px); letter-spacing: .12em; text-align: center; overflow-wrap: anywhere; }
.tema { text-align: center; font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--coin); }
.big-name { font-family: var(--display); font-size: clamp(30px, 10vw, 48px); text-align: center; color: var(--ball); overflow-wrap: anywhere; }
.timer { width: 120px; height: 120px; margin: 0 auto; position: relative; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 40px; font-variant-numeric: tabular-nums; }
.timer.low .n { color: var(--hit); }
.recharge {
  width: min(220px, 70vw); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: 0; display: grid; place-items: center;
  font-family: var(--display); font-size: 26px; background: var(--ball); color: var(--ball-ink); box-shadow: 0 6px 0 #b85800;

.target.hitnow { border-color: var(--hit); }
.hearts { color: var(--hit); letter-spacing: 2px; font-size: 15px; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk-dim); padding: 6px 4px; border-bottom: 2px solid var(--lines); }
table.score td { padding: 8px 4px; border-bottom: 1px solid var(--lines); }
table.score td.num, table.score th.num { text-align: right; }
table.score tr.out td { opacity: .5; }
.coin { color: var(--coin); }
.scorebar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.scorebar::-webkit-scrollbar { display: none; }
.mini { flex: none; background: var(--court-2); border: 2px solid var(--lines); border-radius: 10px; padding: 6px 10px; font-size: 14px; display: flex; flex-direction: column; min-width: 84px; }
.mini.now { border-color: var(--ball); }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top .clock { font-family: var(--mono); font-size: 14px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--chalk-dim); text-decoration: underline; font-size: 15px; padding: 6px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--chalk); color: var(--court); padding: 10px 16px; border-radius: 10px; font-weight: 800; z-index: 30; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast button { background: var(--court); color: var(--chalk); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 800; }
.stars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.stars button { min-height: 64px; border-radius: 12px; border: 2px solid var(--lines); background: var(--panel); font-size: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.stars button small { font-size: 11px; font-family: var(--mono); color: var(--chalk-dim); }
.stars button[aria-pressed="true"] { background: var(--coin); border-color: var(--coin); color: #2a2100; }
.stars button[aria-pressed="true"] small { color: #2a2100; }
.sug { border-left: 4px solid var(--coin); padding: 6px 0 6px 12px; display: flex; flex-direction: column; gap: 4px; }
.sug .meta { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); }
.sug p { white-space: pre-wrap; overflow-wrap: anywhere; }
.qr { background: #ffffff; padding: 12px; border-radius: 12px; width: fit-content; margin: 0 auto; }
.qr img, .qr canvas { display: block; width: 200px !important; height: 200px !important; }
.url { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; text-align: center; color: var(--chalk-dim); user-select: all; }
ol.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  return `<div class="times-lista">${Array.from({ length: n }, (_, t) => `<div class="time-card" style="border-color:${TIMES[t].cor}"><b style="color:${TIMES[t].cor}">${TIMES[t].nome}</b><span>${jogadores.filter(p => p.time === t).map(p => esc(p.nome) + (p.humano === false ? " 🤖" : "")).join(", ")}</span></div>`).join("")}</div>`;
}

/* ---------- Partida ---------- */
function comecarPartida() {
  const c = G.cfg;
  const comTime = G.timeTam && G.nomes.length >= G.timeTam * 2 ? sortearTimes(G.nomes.map(nome => ({ nome, humano: true })), G.timeTam, false) : null;
  G.j = G.nomes.map((nome, i) => ({ i, nome, vidas: c.vidas, vivo: true, moedas: 0, guardado: G.banco[nome] || 0, ganho: 0, compradas: 0, saiuEm: null, time: comTime ? comTime.find(o => o.nome === nome).time : null }));
  G.comTimes = !!comTime;
  G.p = { inicio: agora(), palavras: 0, acertos: 0, erros: 0, timeouts: 0, votos: 0, votosOk: 0, arremessos: 0, acertosBola: 0, rodadas: 0, compras: 0, dicas: 0, moedas: {}, eventos: [] };
  G.perg = null; ir("sorteio");
}
function definirPerguntador(i) { G.perg = i; G.segredoAberto = false; evento("perguntador", { quem: G.j[i].nome }); ir("segredo"); }
function iniciarRodada() {
  const n = G.j.length;
  G.ordem = [];
  for (let k = 1; k < n; k++) { const p = G.j[(G.perg + k) % n]; if (p.vivo && !mesmoTime(p, G.j[G.perg])) G.ordem.push(p.i); }
  G.vez = 0; G.voltas = 0; G.p.palavras++;
  evento("palavra", { tema: G.tema, tamanho: G.palavra.length });
  if (!G.ordem.length) { terminar(G.perg); return; }
  comecarVez(); ir("pergunta");
}
function comecarVez() { G.prazo = agora() + G.cfg.tempo * 1000; G.pausa = null; salvar(); }
function mascara() { return [...G.palavra].map((c, i) => c === " " ? " " : (G.rev.includes(i) ? c : "_")).join(" "); }
function revelarLetra(c) { [...G.palavra].forEach((ch, i) => { if (ch === c && !G.rev.includes(i)) G.rev.push(i); }); }

function respondeu(certo, timeout) {
  const p = G.j[G.ordem[G.vez]], perg = G.j[G.perg];
  if (certo) {
    ganhar(p, G.cfg.mAcerto, "acerto"); G.p.acertos++;
    evento("acerto", { quem: p.nome, segundos: Math.round((G.cfg.tempo * 1000 - (G.prazo - agora())) / 1000) });
    bip(1100, .2); vibrar(80);
    G.atir = p.i; G.atingidos = []; G.recargaAte = 0; G.ultimoHit = null;
    ir("bola"); return;
  }
  ganhar(perg, G.cfg.mErro, "erro"); G.p.erros++; if (timeout) G.p.timeouts++;
  evento(timeout ? "tempo" : "erro", { quem: p.nome });
  toast(timeout ? `${p.nome}: acabou o tempo. Perdeu a vez.` : `${p.nome} errou e perdeu a vez.`);
  G.vez++;
  if (G.vez >= G.ordem.length) { G.vez = 0; G.voltas++; ir("volta"); return; }
  comecarVez(); render();
}
function atingir(i) {
  const p = G.j[i];
  if (!p.vivo) return;
  p.vidas--; G.p.acertosBola++; if (!G.atingidos.includes(i)) G.atingidos.push(i);
  G.ultimoHit = i; evento("bolada", { em: p.nome, por: G.j[G.atir].nome });
  vibrar([60, 40, 60]); bip(300, .25);
  if (p.vidas <= 0) {
    if (p.compradas < G.cfg.maxCompra && (saldoCompra(p) >= G.cfg.preco || invVidas(p.nome) > 0)) { G.compra = i; ir("compra"); return; }
    eliminar(i); return;
  }
  salvar(); render();
  toast(`${p.nome} perdeu 1 vida`, "Desfazer", () => desfazerHit(i));
}
function desfazerHit(i) {
  const p = G.j[i]; p.vidas++; G.p.acertosBola--; G.atingidos = G.atingidos.filter(x => x !== i);
  evento("desfazer", { em: p.nome }); salvar(); render();
}
function eliminar(i) {
  const p = G.j[i]; p.vivo = false; p.saiuEm = agora() - G.p.inicio; evento("saiu", { quem: p.nome });
  const v = vivos();
  if (G.comTimes ? new Set(v.map(q => q.time)).size === 1 : v.length === 1) { terminar(v[0].i); return; }
  salvar(); ir("bola"); toast(`${p.nome} saiu do jogo`);
}
function fimDaBola() {
  const atir = G.j[G.atir];
  const sobrev = vivos().filter(p => p.i !== G.atir && !mesmoTime(p, atir) && !G.atingidos.includes(p.i));
  sobrev.forEach(p => ganhar(p, G.cfg.mSobreviver, "sobreviver"));
  G.p.rodadas++;
  evento("rodada", { atirador: atir.nome, atingidos: G.atingidos.length, sobreviveram: sobrev.length });
  toast(`${sobrev.length} sobreviveram (+${fmtM(G.cfg.mSobreviver)} moedas cada)`);
  definirPerguntador(G.atir);
}
async function terminar(vencedor) {
  const v = G.j[vencedor], tv = G.comTimes ? timeDe(v) : null;
  G.p.fim = agora(); G.p.vencedor = tv ? "Time " + tv.nome : v.nome; G.p.corVencedor = tv ? tv.cor : null;
  G.vitorias = G.vitorias || {};
  (tv ? G.j.filter(p => mesmoTime(p, v)) : [v]).forEach(p => { G.vitorias[p.nome] = (G.vitorias[p.nome] || 0) + 1; });
  G.j.forEach(p => fimDePartidaMissao(p.nome, p.ganho, tv ? mesmoTime(p, v) : p === v));
  evento("fim", { vencedor: G.p.vencedor });
  G.j.forEach(guardarGanhos);
  sfxVitoria();
  ir("fim");
  if (db && podeGravar) {
    try {
      const ref = await db.collection("partidas").add({
        em: G.p.inicio, duracaoSeg: Math.round((G.p.fim - G.p.inicio) / 1000), vencedor: G.p.vencedor, cfg: G.cfg,
        jogadores: G.j.map(p => ({ nome: p.nome, vidas: p.vidas, ganho: Math.round(p.ganho * 10) / 10, moedas: Math.round(p.moedas * 10) / 10, compradas: p.compradas, saiuEmSeg: p.saiuEm ? Math.round(p.saiuEm / 1000) : null })),
        stats: { palavras: G.p.palavras, acertos: G.p.acertos, erros: G.p.erros, timeouts: G.p.timeouts, votos: G.p.votos, votosOk: G.p.votosOk, arremessos: G.p.arremessos, acertosBola: G.p.acertosBola, rodadas: G.p.rodadas, compras: G.p.compras, dicas: G.p.dicas, moedas: G.p.moedas },
        eventos: G.p.eventos,
      });
      G.p.id = ref.id; salvar();
      await salvarPlacar();
    } catch { toast("A partida não foi salva na nuvem, só neste aparelho."); }
  }
}

function render() {
  const app = $("app");

function depois() { if (depoisFn) { const f = depoisFn; depoisFn = null; f(); } }
const acoes = {};
function ligar(root) {
  root.querySelectorAll("[data-a]").forEach(el => {
    const ev = el.tagName === "FORM" ? "submit" : "click";
    el.addEventListener(ev, e => { if (ev === "submit") e.preventDefault(); const f = acoes[el.dataset.a]; if (f) f(el, e); });
  });
}
function barra() {
  const atual = G.tela === "bola" ? G.atir : (G.tela === "pergunta" ? G.ordem[G.vez] : null);

}

    ${topo("Bola!")}
    ${barra()}
    <div style="text-align:center"><p class="dim">A palavra era <b>${esc(G.palavra)}</b>. A bola está com</p><div class="big-name">${esc(atir.nome)}</div></div>
    <p style="text-align:center">Todo mundo corre para o outro lado e volta pro seu lugar!</p>
    <button class="recharge" id="recharge" data-a="atirar">ATIRAR</button>
    <p class="dim" style="text-align:center;font-size:14px">Toque em ATIRAR a cada arremesso para começar a recarga de ${String(G.cfg.recarga).replace(".", ",")} s.</p>
    <h3>Acertou em quem?</h3>
    <div class="targets">${alvos.map(p => `<button class="target${G.ultimoHit === p.i ? " flash" : ""}" data-a="hit" data-i="${p.i}"><b>${esc(p.nome)}</b><span class="hearts">${"●".repeat(Math.min(10, p.vidas))}</span></button>`).join("")}</div>
    <button class="btn ok" data-a="voltaram">Todo mundo voltou pro lugar</button>`;
};

TELAS.compra = () => {
  const p = G.j[G.compra];
  return `
    ${topo("Última vida")}
    <h2>${esc(p.nome)} perdeu a última vida</h2>
    <div class="card"><p>${esc(p.nome)} tem <b class="coin">${fmtM(saldoCompra(p))}</b> moedas guardadas${invVidas(p.nome) ? ` e <b class="hearts">${invVidas(p.nome)} ${invVidas(p.nome) === 1 ? "vida extra guardada" : "vidas extras guardadas"}</b>` : ""}. Uma vida extra custa <b class="coin">${G.cfg.preco}</b>.</p>
    <p class="dim">Já usou ${p.compradas} de ${G.cfg.maxCompra} vidas extras nesta partida.</p></div>
    ${invVidas(p.nome) ? `<button class="btn ok" data-a="usarVida">Usar vida extra guardada</button>` : ""}
    ${saldoCompra(p) >= G.cfg.preco ? `<button class="btn ${invVidas(p.nome) ? "ghost" : "ok"}" data-a="comprar">Comprar vida extra agora (${G.cfg.preco})</button>` : ""}
    <button class="btn no" data-a="naoComprar">Sair do jogo</button>`;
};

TELAS.fim = () => {
  const dur = (G.p.fim || agora()) - G.p.inicio;
  const ord = [...G.j].sort((a, b) => (b.vivo - a.vivo) || ((b.saiuEm || 0) - (a.saiuEm || 0)));
  return `
    <span class="eyebrow">Fim de partida · ${fmtT(dur)}</span>
    <div style="text-align:center"><p class="dim">Quem sobrou por último</p><div class="big-name">${esc(G.p.vencedor)}</div><h2>venceu!</h2></div>
    <div class="card">
      <table class="score"><thead><tr><th>Jogador</th><th class="num">Ganhou</th><th class="num">Guardadas</th></tr></thead>
      <tbody>${ord.map(p => `<tr class="${p.vivo ? "" : "out"}"><td>${esc(p.nome)}${p.compradas ? ` <span class="dim">(+${p.compradas} vida)</span>` : ""}</td><td class="num coin">+${fmtM(p.ganho)}</td><td class="num">${fmtM(G.banco[p.nome] || 0)}</td></tr>`).join("")}</tbody></table>
      <p class="dim" style="font-size:14px">${G.p.palavras} palavras · ${G.p.acertos} acertos · ${G.p.erros} chutes errados · ${G.p.arremessos} arremessos, ${G.p.acertosBola} na mosca · ${G.p.votos} votações</p>
    </div>
    <button class="btn" data-a="sugComecar">Cada um dá uma nota e uma sugestão</button>
    <button class="btn ghost" data-a="revanche">Revanche com a mesma turma</button>
    <button class="link" data-a="inicio">Voltar ao início</button>`;
};

TELAS.sugestao = () => {
  const s = G.sug;
  if (s.fila && !s.aberto) {
    const nome = s.fila[s.idx];
    return `
      ${topo("Sugestões · " + (s.idx + 1) + " de " + s.fila.length)}
      <div class="card hot" style="text-align:center">
        <p class="dim">Passe o celular para</p>
        <div class="big-name">${esc(nome)}</div>
        <button class="btn" data-a="sugAbrir">Sou ${esc(nome)}</button>
        <button class="link" data-a="sugPular">Pular ${esc(nome)}</button>
      </div>`;
  }
  return `
    ${topo(s.fila ? "Sugestão de " + s.fila[s.idx] : "Sugestão")}
    <form class="card" data-a="sugEnviar" autocomplete="off">
      ${s.fila ? "" : `<div class="field"><label for="sg-nome">Seu nome</label><input id="sg-nome" maxlength="20" value="${esc(s.nome || "")}"></div>`}
      <div class="field"><label>Quão divertido foi?</label>
        <div class="stars">${NOTAS.map(([e, t], i) => `<button type="button" data-a="nota" data-n="${i + 1}" aria-pressed="${s.nota === i + 1}" aria-label="${t}">${e}<small>${t}</small></button>`).join("")}</div>
      </div>
      <div class="field"><label for="sg-legal">O que foi mais legal?</label><textarea id="sg-legal" maxlength="500">${esc(s.legal || "")}</textarea></div>
      <div class="field"><label for="sg-mudaria">O que você mudaria no jogo?</label><textarea id="sg-mudaria" maxlength="800">${esc(s.mudaria || "")}</textarea></div>
      <button class="btn" type="submit">Enviar</button>
      <button class="link" type="button" data-a="${s.fila ? "sugPular" : "inicio"}">${s.fila ? "Pular" : "Cancelar"}</button>
    </form>`;
};

TELAS.obrigado = () => `
  <div class="card hot" style="text-align:center"><h2>Valeu, turma!</h2><p class="dim">As sugestões foram guardadas para o Andre melhorar o jogo.</p></div>
  <button class="btn" data-a="revanche">Jogar de novo</button>
  <button class="btn ghost" data-a="mais">Ver as sugestões</button>
  <button class="btn ghost small" data-a="inicio">Tela inicial</button>`;

TELAS.convidado = () => `
  <header style="display:flex;flex-direction:column;gap:8px">
    <span class="eyebrow">Jogo do Andre</span>
    <h1>Jogo de <em>Pergunta</em></h1>
    <p class="dim">Forca com queimada. O jogo acontece no celular do Andre, que é o juiz. Aqui estão as regras.</p>
  </header>
  <div class="card"><h3>Regras</h3>${regrasHTML()}</div>
  <div class="card"><h3>Quer dar uma ideia?</h3><p class="dim">No fim de cada partida o celular do Andre passa de mão em mão. É lá que você deixa sua nota e sua sugestão.</p></div>`;

/* ---------- Ações ---------- */
Object.assign(acoes, {
  addNome() {
    const inp = $("nome"); const n = inp.value.trim().replace(/\s+/g, " ");
    if (!n) return;
    if (G.nomes.some(x => x.toLowerCase() === n.toLowerCase())) { toast("Esse nome já está na lista"); return; }
    if (G.nomes.length >= 20) { toast("Máximo de 20 jogadores"); return; }
    G.nomes.push(n); salvar(); render(); $("nome").focus();
  },
  tirar(el) { G.nomes.splice(+el.dataset.i, 1); salvar(); render(); },
  copiarSug(el) {
    const txt = "Sugestões do Jogo de Pergunta\n\n" + sugestoes.map(s => `${s.nome || "Alguém"} (${s.nota ? NOTAS[s.nota - 1][1] : "sem nota"})` + (s.legal ? `\nMais legal: ${s.legal}` : "") + (s.mudaria ? `\nMudaria: ${s.mudaria}` : "")).join("\n\n");
    const mostrar = () => { const ta = $("sug-texto"); if (ta) { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); } toast("Selecionei o texto: é só copiar"); };
    try { navigator.clipboard.writeText(txt).then(() => { el.textContent = "Copiado!"; toast("Copiado. Agora cole no WhatsApp"); }, mostrar); } catch { mostrar(); }
  },
  comecar() { G.ultimoModo = "juiz"; comecarPartida(); },
  arena() { abrirArena(); },
  continuar() { ir(G.telaAntes || "pergunta"); },
  descartar() { G.p = null; G.j = []; salvar(); render(); },
  cfgPadrao() { G.cfg = { ...PADRAO }; salvar(); render(); },
  alternarImprimir(el) { if (!ajustesAbertos) return; G.imprimir3d = el.checked; salvar(); toast(el.checked ? "Imprimir 3D ligado neste aparelho" : "Imprimir 3D escondido"); },
  sortear() { definirPerguntador(Math.floor(Math.random() * G.j.length)); },
  escolherPerg(el) {
    const i = +el.dataset.i;
    if (G.tela === "novoPerg") evento("trocaVoto", { para: G.j[i].nome });
    definirPerguntador(i);
  },
  abrirSegredo() { G.segredoAberto = true; G.palavra = ""; G.rev = []; G.tema = ""; salvar(); render(); setTimeout(() => $("palavra") && $("palavra").focus(), 50); },
  tema(el) { G.tema = el.dataset.t; guardarCamposSegredo(true); },
  letra(el) { guardarCamposSegredo(); G.rev = []; revelarLetra(el.dataset.c); salvar(); render(); },
  confirmaSegredo() { guardarCamposSegredo(); if (!G.palavra || !G.rev.length) return; G.segredoAberto = false; iniciarRodada(); },
  certo() { respondeu(true); },
  errado() { respondeu(false); },
  pausar() {
    if (G.pausa) { G.prazo = agora() + G.pausa; G.pausa = null; } else { G.pausa = Math.max(0, G.prazo - agora()); }
    salvar(); render();
  },
  dificil() { G.votoDe = G.tela; G.votoSim = 0; G.p.votos++; evento("votoInicio", {}); ir("voto"); },
  votoMais() { G.votoSim = Math.min(G.ordem.length, G.votoSim + 1); salvar(); render(); },
  votoMenos() { G.votoSim = Math.max(0, G.votoSim - 1); salvar(); render(); },
  votoCancelar() { G.p.votos--; ir(G.votoDe || "pergunta"); if (G.tela === "pergunta") comecarVez(); },
  votoFim() {
    const total = G.ordem.length, perg = G.j[G.perg];
    if (G.votoSim > total / 2) {
      const perda = perg.moedas * G.cfg.perdaVoto / 100; perg.moedas -= perda; perg.ganho -= perda;
      G.p.votosOk++; evento("votoPassou", { sim: G.votoSim, total, perg: perg.nome, perda: Math.round(perda * 10) / 10 });
      ir("novoPerg");
    } else {
      evento("votoNaoPassou", { sim: G.votoSim, total });
      if (G.votoDe === "volta") ir("volta"); else { comecarVez(); ir("pergunta"); }
    }
  },
  maisLetra(el) { revelarLetra(el.dataset.c); G.p.dicas++; evento("letra", {}); comecarVez(); ir("pergunta"); },
  dicaFalada() { G.p.dicas++; evento("dica", {}); comecarVez(); ir("pergunta"); },
  atirar() {
    if (agora() < G.recargaAte) return;
    G.p.arremessos++; evento("arremesso", { por: G.j[G.atir].nome });
    G.recargaAte = agora() + G.cfg.recarga * 1000; G.recargaAvisou = false; salvar(); tic();
  },
  hit(el) { atingir(+el.dataset.i); },
  voltaram() { fimDaBola(); },
  comprar() {
    const p = G.j[G.compra]; if (saldoCompra(p) < G.cfg.preco) return; pagarVida(p, G.cfg.preco); p.compradas++; p.vidas = 1; G.p.compras++;
    evento("compra", { quem: p.nome }); G.compra = null; toast(`${p.nome} comprou uma vida extra`); ir("bola");
  },
  naoComprar() { const i = G.compra; G.compra = null; eliminar(i); },
  usarVida() {
    const p = G.j[G.compra]; mudarInv(p.nome, -1); p.compradas++; p.vidas = 1; G.p.compras++;
    evento("usouVida", { quem: p.nome }); G.compra = null; salvarPlacar(); toast(`${p.nome} usou uma vida extra da loja`); ir("bola");
  },
  revanche() { G.sug = null; if (G.ultimoModo === "arena") { $("app").hidden = true; abrirArena(); return; } comecarPartida(); },
  inicio() { G.sug = null; if (G.p && G.p.fim) { G.p = null; G.j = []; } ir("lobby"); },
  sugComecar() { G.sug = { fila: G.j.map(p => p.nome), idx: 0, aberto: false, partidaId: G.p && G.p.id || null }; ir("sugestao"); },
  sugAvulsa() { G.sug = { nome: "" }; ir("sugestao"); },
  sugAbrir() { G.sug.aberto = true; G.sug.nota = 0; G.sug.legal = ""; G.sug.mudaria = ""; salvar(); render(); },
  sugPular() { proximaSug(); },
  nota(el) { guardarCamposSug(); G.sug.nota = +el.dataset.n; salvar(); render(); },
  async sugEnviar() {
    guardarCamposSug();
    const s = G.sug;
    const nome = s.fila ? s.fila[s.idx] : (s.nome || "").trim();
    if (!s.nota && !s.legal.trim() && !s.mudaria.trim()) { toast("Escreva alguma coisa ou toque em uma carinha"); return; }
    const doc = { nome: nome || "Alguém", nota: s.nota || null, legal: s.legal.trim(), mudaria: s.mudaria.trim(), em: agora(), partidaId: s.partidaId || null };
    if (db && podeGravar) {
      try { await db.collection("sugestoes").add(doc); }
      catch { guardarLocal(doc); toast("Sem internet: a sugestão ficou guardada neste aparelho."); }
    } else guardarLocal(doc);
    if (s.fila) proximaSug(); else { G.sug = null; toast("Sugestão enviada. Valeu!"); ir("inicio"); }
  },
  async resumo() {
    const out = $("resumo"); if (!out || !sample) return;
    out.hidden = false; out.textContent = "Lendo as sugestões…";
    const lista = sugestoes.slice(0, 60).map(s => `- ${s.nome || "Alguém"} (nota ${s.nota || "?"}/5). Mais legal: ${s.legal || "-"}. Mudaria: ${s.mudaria || "-"}`).join("\n");
    try {
      const r = await sample(`Estas são sugestões de crianças que jogaram "Jogo de Pergunta", um jogo criado pelo Andre (forca + queimada).
Resuma para o Andre, em português simples e animado, em até 150 palavras, sem markdown:
1) o que a turma mais curtiu, 2) as mudanças mais pedidas (diga quantas pessoas pediram cada uma), 3) uma sugestão de próximo teste.

Sugestões:
${lista}`, { onText: ({ text }) => { out.textContent = text; } });
      out.textContent = r.text;
    } catch (e) {
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { out.hidden = true; sample = null; }
      else out.textContent = (e && e.text) || "Não deu para resumir agora. Tente de novo daqui a pouco.";
    }
  },
});
function guardarCamposSegredo(rerender) {
  const t = $("tema"), w = $("palavra");
  if (t) G.tema = rerender && G.tema ? G.tema : t.value.trim();
  if (w) {
    const nova = w.value.toUpperCase().replace(/\s+/g, " ").trim();
    if (nova !== G.palavra) { G.palavra = nova; G.rev = []; }
  }
  salvar(); if (rerender) render();
}
function guardarCamposSug() {
  const s = G.sug; if (!s) return;
  if ($("sg-nome")) s.nome = $("sg-nome").value;
  if ($("sg-legal")) s.legal = $("sg-legal").value;
  if ($("sg-mudaria")) s.mudaria = $("sg-mudaria").value;
}
function proximaSug() {
  const s = G.sug; s.idx++; s.aberto = false;
  if (s.idx >= s.fila.length) { G.sug = null; ir("obrigado"); return; }
  salvar(); render();
}
function guardarLocal(doc) {
  try { const a = JSON.parse(localStorage.getItem("ms-sug-pendentes") || "[]"); a.push(doc); localStorage.setItem("ms-sug-pendentes", JSON.stringify(a)); } catch {}
  sugestoes = [doc, ...sugestoes];
}
async function enviarPendentes() {
  if (!db || !podeGravar) return;
  let a = []; try { a = JSON.parse(localStorage.getItem("ms-sug-pendentes") || "[]"); } catch {}
  if (!a.length) return;
  const resto = [];
  for (const d of a) { try { await db.collection("sugestoes").add(d); } catch { resto.push(d); } }
  try { localStorage.setItem("ms-sug-pendentes", JSON.stringify(resto)); } catch {}
}

/* campos que re-renderizam ao mudar */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.k) {
    const v = parseFloat(String(t.value).replace(",", "."));
    if (isFinite(v)) { G.cfg[t.dataset.k] = Math.min(+t.max, Math.max(+t.min, v)); salvar(); }
    render();
  }
  if (t.id === "palavra") { guardarCamposSegredo(); render(); }
  if (t.id === "tema") guardarCamposSegredo();
});
document.addEventListener("input", e => { if (e.target.id === "palavra") { const pos = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); try { e.target.setSelectionRange(pos, pos); } catch {} } });

/* espiar a palavra segurando */
document.addEventListener("pointerdown", e => {
  const el = e.target.closest && e.target.closest('[data-a="espiar"]'); if (!el) return;
  const m = $("mask"); if (m) m.textContent = G.palavra;
  const solta = () => { const mm = $("mask"); if (mm) mm.textContent = mascara(); window.removeEventListener("pointerup", solta); window.removeEventListener("pointercancel", solta); };
  window.addEventListener("pointerup", solta); window.addEventListener("pointercancel", solta);
});

/* ---------- Relógios ---------- */
function tic() {
  if (G.p && $("clock")) $("clock").textContent = fmtT((G.p.fim || agora()) - G.p.inicio);
  if (G.tela === "pergunta") {
    const resta = G.pausa != null ? G.pausa : G.prazo - agora();
    const s = Math.max(0, Math.ceil(resta / 1000));
    const sec = $("secs"), arc = $("arc"), tm = $("timer");
    if (sec) sec.textContent = s;
    if (arc) arc.setAttribute("stroke-dashoffset", String(326.7 * (1 - Math.max(0, resta) / (G.cfg.tempo * 1000))));
    if (tm) tm.classList.toggle("low", s <= 5);
    if (G.pausa == null && resta <= 0) { bip(220, .35); vibrar(200); respondeu(false, true); }
  }
  if (G.tela === "bola") {
    const r = $("recharge"); if (!r) return;
    const falta = G.recargaAte - agora();
    if (falta > 0) { r.disabled = true; r.textContent = (falta / 1000).toFixed(1).replace(".", ",") + " s"; }
    else { if (r.disabled) { bip(1320, .12); } r.disabled = false; r.textContent = "ATIRAR"; }
  }
}
setInterval(tic, 100);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tic(); });

/* ---------- QR ---------- */
function desenharQR() {
  const box = $("qr"); if (!box) return;
  box.innerHTML = "";
  if (typeof QRCode === "undefined" || LINK.endsWith("PENDENTE")) { box.textContent = "QR indisponível"; box.style.color = "#000"; return; }
  try { new QRCode(box, { text: LINK, width: 400, height: 400, colorDark: "#0f3057", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch {}
}

/* ---------- Nuvem ---------- */
if (G.tela === "pergunta" && G.pausa == null) comecarVez();
render();
(async () => {
  if (!window.claude || !window.claude.use) { modoLocal = true; render(); return; }
  const [dbc, user, smp] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
  sample = smp;
  let dono = false, escreve = null;
  if (user) { try { dono = await user.isOwner(); escreve = await user.can("data.write"); } catch {} }
  if (dbc) { db = dbc; podeGravar = dono || escreve === true || (escreve === null && !!user); }
  modoLocal = !podeGravar;
  if (G.tela === "convidado") G.tela = "inicio";
  if (db) {
    try {
      const pl = await db.doc("placar/moedas").get();
      if (pl.exists) {
        const d = pl.data() || {};
        if ((d.atualizadaEm || 0) > (G.placarEm || 0)) { Object.assign(G.banco, d.moedas || {}); G.inv = { ...(G.inv || {}), ...(d.inventario || {}) }; G.placarEm = d.atualizadaEm; salvar(); }
        else if ((G.placarEm || 0) > (d.atualizadaEm || 0)) salvarPlacar();
      } else if (G.placarEm) salvarPlacar();
    } catch {}
    db.collection("sugestoes").orderBy("em", "desc").limit(100).onSnapshot(s => {
      sugestoes = s.docs.map(d => d.data() || {});
      if (G.tela === "inicio") { const y = window.scrollY; render(); window.scrollTo(0, y); }
    }, () => {});
    db.collection("partidas").get().then(s => { partidasSalvas = s.size; if (G.tela === "inicio") { const y = window.scrollY; render(); window.scrollTo(0, y); } }).catch(() => {});
    enviarPendentes();
    if (typeof sincronizarPersonagens === "function") sincronizarPersonagens();
  }
  render();
})();
</script>

<script>
/* ================= Arena dos bonequinhos ================= */
const AP = {
  Animais: ["GATO", "CACHORRO", "GIRAFA", "ELEFANTE", "TUBARAO", "CORUJA", "TARTARUGA", "MACACO", "LEAO", "COBRA"],
  Frutas: ["BANANA", "MORANGO", "ABACAXI", "UVA", "MELANCIA", "LARANJA", "MANGA", "LIMAO"],

  Objetos: ["CADEIRA", "MOCHILA", "CELULAR", "TESOURA", "RELOGIO", "LANTERNA", "ESPELHO"],
  Jogos: ["MINECRAFT", "ROBLOX", "FORTNITE", "XADREZ", "QUEIMADA", "FUTEBOL", "DOMINO"],
  Lugares: ["PRAIA", "ESCOLA", "MERCADO", "CINEMA", "FAZENDA", "PARQUE", "HOSPITAL"],
  Profissões: ["MEDICO", "BOMBEIRO", "PROFESSOR", "PILOTO", "COZINHEIRO", "POLICIAL"],

const A_CORES = ["#e4572e", "#2f80ed", "#27ae60", "#e0b43a", "#9b51e0", "#f2994a", "#2bb5c9", "#d64570", "#6c8a1f", "#8a6be8"];
const A_PELE = ["#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#ffdbac"];
/* Skins da loja: mudam a roupa (camisa), às vezes a pele, e põem um acessório */
const SKINS = [
  { k: "classico", nome: "Clássico", preco: 0 },

function hudA() {
  const ph = A.ph || {};
  $("a-clock").textContent = fmtT(A.t * 1000);
  const bar = $("a-bar");
  const atual = ph.k === "bola" ? ph.atir : (ph.k === "pergunta" ? ph.ordem[ph.idx] : null);
  bar.innerHTML = A.P.map(p => `<div class="mini${p.vivo ? "" : " out"}${p === atual ? " now" : ""}"${timeDe(p) ? ` style="border-color:${timeDe(p).cor}"` : ""}><b>${timeDe(p) ? `<i class="tponto" style="background:${timeDe(p).cor}"></i>` : ""}${esc(p.nome)}${p.humano ? "" : " 🤖"}</b><span class="hearts">${p.vivo ? "●".repeat(Math.min(10, p.vidas)) : "fora"}</span><span class="coin">${fmtM(p.moedas)}</span></div>`).join("");

    $("a-phase").textContent = `${ph.perg.nome} pergunta · volta ${(ph.voltas || 0) + 1}`;
    $("a-tema").textContent = ph.tema; $("a-word").textContent = aMascara(ph);
  } else if (ph.k === "bola") {

  } else if (ph.k === "segredo") {

  } else if (ph.k === "troca") { $("a-phase").textContent = "Troca de papéis"; }
  if (A.fim) $("a-phase").textContent = "Fim de partida";
  const sec = $("a-secs");
  if (sec && ph.k === "pergunta") { const r = Math.max(0, Math.ceil(ph.prazo - A.t)); sec.textContent = r + " s"; sec.style.color = r <= 5 ? "var(--hit)" : ""; }

<script>
/* ================= Música da tela inicial (original, feita na hora pelo navegador) ================= */
const MUS = { ctx: null, master: null, tocando: false, timer: null, passo: 0, proximo: 0, bpm: 118, volta: 0, noise: null };
const TELAS_COM_MUSICA = ["lobby", "loja", "perfil", "missoes"];
const somLigado = () => G.som !== false;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

function musCtx() {

    if (!MUS.master) {
      MUS.master = audio.createGain(); MUS.master.gain.value = 0; MUS.master.connect(audio.destination);
      const n = audio.createBuffer(1, audio.sampleRate * .5, audio.sampleRate), d = n.getChannelData(0);

  } catch { return null; }

/* G – Em – C – D, 16 passos por compasso */
const ACORDES = [[55, 59, 62], [52, 55, 59], [48, 52, 55], [50, 54, 57]];
const BAIXO = [43, 40, 36, 38];
const MELODIA = [
  [67, null, 71, null, 74, null, 71, null, 72, 74, null, 71, null, 67, null, null],
  [64, null, 67, null, 71, null, 67, null, 69, 71, null, 67, null, 64, null, null],
  [64, null, 67, null, 72, null, 76, null, 74, 72, null, 71, null, 72, null, null],
  [74, null, null, 72, null, 71, null, 69, 66, null, 69, null, 74, null, null, null],
];
const RESPOSTA = [
  [79, 78, 79, null, 74, null, null, null, 76, null, 74, null, 71, null, null, null],
  [76, 74, 76, null, 71, null, null, null, 72, null, 71, null, 67, null, null, null],
  [76, null, 79, null, 84, null, 83, null, 81, null, 79, null, 76, null, 79, null],
  [81, null, 79, null, 78, null, 76, null, 74, null, 76, null, 78, 79, 81, 83],
];

function nota(t, freq, dur, tipo, vol, opts = {}) {
  const c = MUS.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, t);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(freq * opts.slide, t + dur);

    const lfo = c.createOscillator(), lg = c.createGain();

  let saida = o;
  if (opts.filtro) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = opts.filtro; o.connect(f); saida = f; }
  saida.connect(g); g.connect(MUS.master);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (opts.ataque || .008));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

}

function palma(t) { ruido(t, .14, .5, "bandpass", 1500); ruido(t + .012, .1, .35, "bandpass", 1100); }

function tocarPasso(i, t) {
  const compasso = Math.floor(i / 16) % 4, p = i % 16, frase = Math.floor(i / 64) % 2;
  const ac = ACORDES[compasso], b = BAIXO[compasso];

function sfxPop() {

  const t = c.currentTime; const o = c.createOscillator(), g = c.createGain();

function sfxJogar() {
  if (!somLigado()) return; const c = musCtx(); if (!c) return;
  const t = c.currentTime;

    const o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = hz(m);

document.addEventListener("pointerdown", e => {
  const naLobby = e.target.closest && e.target.closest(".lobby");
  if (!naLobby) return;
  const btn = e.target.closest("button");
  if (btn && btn.dataset.a === "som") return;
  if (somLigado()) { musCtx(); if (naTelaComMusica()) musicaTocar(); }
  if (btn && btn.dataset.a === "jogar") { musicaParar(true); sfxJogar(); }
  else if (btn) sfxPop();
}, true);
acoes.som = () => {
  G.som = !somLigado(); salvar();
  if (G.som) { musCtx(); musicaTocar(); sfxPop(); } else musicaParar(true);
  render();
};

<script>
/* ================= Música das partidas ================= */
/* Mi menor: Em – C – G – D. Camada calma (chutes) e camada de ação (bola). */
const P_ACORDES = [[52, 55, 59], [48, 52, 55], [55, 59, 62], [50, 54, 57]];
const P_BAIXO = [40, 36, 43, 38];
const P_RIFF = [
  [76, null, 74, 76, null, 79, null, 76, 74, null, 71, null, 74, null, 76, null],
  [76, null, 74, 76, null, 79, null, 81, 79, null, 76, null, 72, null, 74, null],
  [74, null, 71, 74, null, 79, null, 74, 71, null, 67, null, 71, null, 74, null],
  [74, null, 72, 74, null, 78, null, 81, 78, null, 74, null, 78, 79, 81, 83],
];
const ARPEJO = [0, 1, 2, 1, 0, 2, 1, 2];
const TELAS_PARTIDA_JUIZ = ["sorteio", "segredo", "pergunta", "volta", "voto", "novoPerg", "bola", "compra"];
MUS.musica = "lobby";

function tocarPassoPartida(i, t) {
  const compasso = Math.floor(i / 16) % 4, p = i % 16;
  const ac = P_ACORDES[compasso], b = P_BAIXO[compasso];
  const acao = intensidade() === 1;
  if (acao) {
    if (p % 4 === 0) bumbo(t);
    if (p === 4 || p === 12) palma(t);
    chimbal(t, p === 14);
    nota(t, hz(b + (p % 4 === 2 ? 12 : 0)), .16, "sawtooth", .22, { filtro: 700 });
    const r = P_RIFF[compasso][p];
    if (r) nota(t, hz(r), .18, "square", .1, { filtro: 3600 });
    if (p === 0) ac.forEach(m => nota(t, hz(m + 12), .5, "sawtooth", .035, { filtro: 1800, ataque: .03 }));
    if (i % 64 === 63) ruido(t, .4, .22, "highpass", 2500);
  } else {
    if (p === 0 || p === 10) bumbo(t);
    if (p === 8) ruido(t, .05, .16, "bandpass", 2600);
    if (p % 4 === 2) chimbal(t, false);
    if (p === 0 || p === 6 || p === 8) nota(t, hz(b), p === 8 ? .5 : .32, "triangle", .45, { filtro: 600 });
    if (p % 2 === 0) nota(t, hz(ac[ARPEJO[p / 2]] + 12), .22, "triangle", .07, { filtro: 2000 });
    if (p === 0 && compasso % 2 === 0) ac.forEach(m => nota(t, hz(m), 1.6, "sine", .04, { ataque: .25 }));
  }

function intensidade() {
  if (!$("arena").hidden) return A.ph && A.ph.k === "bola" ? 1 : 0;
  return G.tela === "bola" ? 1 : 0;
}
function musicaDesejada() {
  if (!$("arena").hidden) return !$("a-game").hidden && !A.fim ? "partida" : null;
  if ($("app").hidden) return null;
  if (TELAS_COM_MUSICA.includes(G.tela)) return "lobby";
  if (TELAS_PARTIDA_JUIZ.includes(G.tela) && G.p && !G.p.fim) return "partida";
  return null;
}

/* troca a música da tela inicial pela das partidas sem mexer no resto */
const _tocarPassoLobby = tocarPasso;
tocarPasso = function (i, t) { if (MUS.musica === "partida") tocarPassoPartida(i, t); else _tocarPassoLobby(i, t); };
function musicaTrocar(nome) {
  if (!somLigado() || !nome) { if (MUS.tocando) musicaParar(); return; }
  if (MUS.tocando && MUS.musica === nome) return;
  if (MUS.tocando) { MUS.musica = nome; MUS.bpm = nome === "partida" ? 128 : 118; MUS.passo = 0; MUS.proximo = MUS.ctx.currentTime + .05; return; }
  MUS.musica = nome; MUS.bpm = nome === "partida" ? 128 : 118;
  musicaTocar();
}
naTelaComMusica = () => musicaDesejada() === "lobby";
setInterval(() => {
  if (!MUS.ctx || MUS.ctx.state !== "running") return;
  musicaTrocar(musicaDesejada());
}, 250);
document.addEventListener("pointerdown", () => { if (somLigado()) musCtx(); }, true);

function sfxVitoria() {
  if (!somLigado()) { bip(660, .15); setTimeout(() => bip(990, .3), 160); return; }
  const c = musCtx(); if (!c) return;
  const t = c.currentTime + .05;
  const tocar = (m, ini, dur, vol) => {
    const o = c.createOscillator(), g = c.createGain(); o.type = "square"; o.frequency.value = hz(m);
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 3000;
    g.gain.setValueAtTime(.0001, t + ini); g.gain.exponentialRampToValueAtTime(vol, t + ini + .01); g.gain.exponentialRampToValueAtTime(.0001, t + ini + dur);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(t + ini); o.stop(t + ini + dur + .05);
  };
  [[67, 0], [67, .12], [67, .24], [72, .36]].forEach(([m, d]) => tocar(m, d, .14, .14));
  [[72, .6], [76, .6], [79, .6], [84, .6]].forEach(([m, d]) => tocar(m, d, 1.2, .08));
}

/* botão de som dentro das partidas */
function botaoSom() {
  return `<button class="som-mini" data-a="som" type="button" aria-label="${somLigado() ? "Desligar o som" : "Ligar o som"}">${somLigado() ? "🔊" : "🔇"}</button>`;
}
const _topo = topo;
topo = titulo => _topo(titulo).replace('<span class="clock"', botaoSom() + '<span class="clock"');

async function digitalDoPin(pin) {
  const enc = new TextEncoder();
  const chave = await crypto.subtle.importKey("raw", enc.encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(PIN_SAL), iterations: PIN_VOLTAS }, chave, 256);

}

}

<script>
/* ================= Tela de abertura com música de entrada =================
   Aparece toda vez que o jogo abre (menos quando chega por link de sala ou de amigo).
   O navegador só deixa tocar som depois de um toque, por isso o "Toque para entrar".
   A música é original, feita para o Jogo de Pergunta. */
const ABERTURA = { ate: 0 };
function musicaDeEntrada() {
  if (!somLigado()) return 0;
  const c = musCtx(); if (!c) return 0;
  const t0 = c.currentTime + .05, saida = c.createGain(); saida.gain.value = .55; saida.connect(c.destination);
  const tom = (m, ini, dur, tipo, vol, slide) => {
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    o.type = tipo; o.frequency.setValueAtTime(hz(m), t0 + ini); if (slide) o.frequency.exponentialRampToValueAtTime(hz(m) * slide, t0 + ini + dur);
    f.type = "lowpass"; f.frequency.value = 3400;
    g.gain.setValueAtTime(.0001, t0 + ini); g.gain.exponentialRampToValueAtTime(vol, t0 + ini + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + ini + dur);
    o.connect(f); f.connect(g); g.connect(saida); o.start(t0 + ini); o.stop(t0 + ini + dur + .05);
  };
  const barulho = (ini, dur, vol, tipo, freq) => {
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = MUS.noise; f.type = tipo; f.frequency.value = freq; s.connect(f); f.connect(g); g.connect(saida);
    g.gain.setValueAtTime(vol, t0 + ini); g.gain.exponentialRampToValueAtTime(.0001, t0 + ini + dur); s.start(t0 + ini, Math.random() * .3); s.stop(t0 + ini + dur + .05);
  };
  const bumboE = ini => tom(43, ini, .25, "sine", .9, .35);
  // rufar de caixa acelerando
  [0, .14, .26, .36, .44, .5, .55, .59].forEach((d, i) => barulho(d, .08, .18 + i * .04, "bandpass", 1800));
  tom(55, 0, .62, "sawtooth", .05, 2);                                   // sobe junto com o rufar
  // fanfarra: C – F – G – C
  const b = .64;
  bumboE(b); barulho(b, .9, .22, "highpass", 6000);
  [60, 64, 67].forEach(m => tom(m, b, .5, "square", .06));
  [[72, 0, .2], [76, .2, .2], [79, .4, .22], [84, .64, .5]].forEach(([m, d, dur]) => tom(m, b + d, dur, "square", .12));
  [65, 69, 72].forEach(m => tom(m, b + .64, .45, "square", .05)); bumboE(b + .64);
  [[83, 1.12, .12], [81, 1.24, .12], [79, 1.36, .14]].forEach(([m, d, dur]) => tom(m, b + d - .64 + .64, dur, "square", .11));
  [67, 71, 74].forEach(m => tom(m, b + 1.12, .4, "square", .05)); bumboE(b + 1.12);
  // final: acorde grande com prato
  const f = b + 1.56;
  bumboE(f); barulho(f, 1.4, .3, "highpass", 5000);
  [48, 60, 64, 67, 72, 76, 84].forEach((m, i) => tom(m, f + i * .015, 1.3, i ? "square" : "triangle", i ? .055 : .3));
  tom(84, f, 1.2, "sine", .12);
  [[48, b], [53, b + .64], [55, b + 1.12]].forEach(([m, d]) => tom(m, d, .4, "triangle", .35));
  return (f + 1.3) * 1000;
}
function mostrarAbertura() {
  const el = document.createElement("div"); el.id = "abertura"; el.className = "abertura"; el.setAttribute("role", "button"); el.tabIndex = 0;
  el.setAttribute("aria-label", "Toque para entrar no Jogo de Pergunta");
  el.innerHTML = `<div class="ab-brilho" aria-hidden="true"></div>
    <h1 class="ab-titulo">Jogo de<br>Pergunta</h1>
    <div class="ab-barra" aria-hidden="true"><i></i></div>
    <p class="ab-toque">Toque para entrar</p>`;
  document.body.append(el);
  const entrar = () => {
    if (el.classList.contains("saindo")) return;
    const dura = musicaDeEntrada();
    ABERTURA.ate = Date.now() + (dura ? dura - 600 : 0);   // a música da tela inicial entra quando a fanfarra acaba
    el.classList.add("saindo"); setTimeout(() => el.remove(), 650);
  };
  el.addEventListener("click", entrar);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); entrar(); } });
}
/* segura a música da tela inicial enquanto a fanfarra toca */
const _musicaDesejadaAbertura = musicaDesejada;
musicaDesejada = () => (document.getElementById("abertura") || Date.now() < ABERTURA.ate ? null : _musicaDesejadaAbertura());
naTelaComMusica = () => musicaDesejada() === "lobby";
{
  const q = new URLSearchParams(location.search);
  if (!q.get("sala") && !q.get("amigo") && G.tela === "lobby") mostrarAbertura();
}

<script>
/* ================= Avisos do ADM para todo mundo =================
   Ficam em avisos.json, na raiz do site (GitHub Pages). Só quem pode mexer no repositório publica.
   Cada jogo aberto confere o arquivo a cada minuto; aviso novo aparece uma vez em janela e,
   enquanto vale, numa faixa na tela inicial. Dentro do Claude não chega (o artefato não lê o site). */
const AVISOS = { lista: [], url: (location.pathname.includes("/teste/") ? "../" : "") + "avisos.json" };
const avisoValido = a => a && typeof a === "object" && typeof a.id === "string" && typeof a.texto === "string" && a.texto.trim()
  && (!a.ate || Date.now() <= Date.parse(a.ate)) && (!a.de || Date.now() >= Date.parse(a.de));
const avisosAtivos = () => AVISOS.lista.filter(avisoValido);
async function buscarAvisos() {
  try {
    const r = await fetch(AVISOS.url + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const d = await r.json(); AVISOS.lista = Array.isArray(d.avisos) ? d.avisos.slice(0, 20) : [];
    const lst = (v, n) => Array.isArray(v) ? v.filter(x => x && typeof x === "object").slice(0, n) : [];
    const antes = JSON.stringify([eventoMoedas(), promoAtiva()]);
    EVT.eventos = lst(d.eventos, 10); EVT.promos = lst(d.promos, 10); EVT.presentes = lst(d.presentes, 50);
    aplicarLimitadas();
    if (antes !== JSON.stringify([eventoMoedas(), promoAtiva()]) && G.tela === "loja" && !$("app").hidden && !(document.activeElement && document.activeElement.id === "pres-cod")) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch { return; }
  const vistos = G.avisosVistos = G.avisosVistos || [];
  const novo = avisosAtivos().find(a => !vistos.includes(a.id));
  if (novo) { vistos.push(novo.id); G.avisosVistos = vistos.slice(-50); salvar(); mostrarAviso(novo); }
  if (G.tela === "lobby" && !$("app").hidden) render();
}
function mostrarAviso(a) {
  let el = $("aviso-adm");
  if (!el) { el = document.createElement("div"); el.id = "aviso-adm"; el.className = "aviso-adm"; el.setAttribute("role", "alertdialog"); el.setAttribute("aria-label", "Aviso do ADM"); document.body.append(el); }
  el.innerHTML = `<div class="aviso-caixa"><span class="aviso-tag">📢 Aviso do ADM</span><p>${esc(a.texto.slice(0, 200))}</p><button type="button" class="lb-jogar" id="aviso-ok">OK!</button></div>`;
  el.hidden = false; $("aviso-ok").onclick = () => { el.hidden = true; };
  if (typeof tocarNotas === "function") tocarNotas([[72, 72, 0, .12, "square"], [79, 79, .14, .12, "square"], [84, 84, .28, .3, "square"]]);
  vibrar([80, 50, 80]);
}
function avisoFaixa() {
  const a = avisosAtivos().slice(-1)[0]; if (!a) return "";
  return `<button type="button" class="aviso-faixa" data-a="verAviso"><span>📢 ${esc(a.texto.slice(0, 200))}</span></button>`;
}
acoes.verAviso = () => { const a = avisosAtivos().slice(-1)[0]; if (a) mostrarAviso(a); };
if (location.protocol.startsWith("http") && !/claude|claudeusercontent/.test(location.hostname)) {
  setTimeout(buscarAvisos, 1500); setInterval(() => { if (!document.hidden) buscarAvisos(); }, 60000);
}

/* aba "Aviso" no Painel de ADM: monta o arquivo novo para colar no GitHub */
const LINK_EDITAR_AVISOS = "https://github.com/thidesigner/mete-sarrafo/edit/main/avisos.json";
function montarAvisosNovos(texto, horas) {
  const agora = Date.now(), id = "a" + agora.toString(36);
  const mantidos = AVISOS.lista.filter(avisoValido).slice(-4);
  return JSON.stringify({ avisos: [...mantidos, { id, texto: texto.slice(0, 200), de: new Date(agora).toISOString(), ate: new Date(agora + horas * 3600000).toISOString() }] }, null, 2);
}
acoes.admPrepararAviso = () => {
  const t = ($("adm-aviso") || {}).value || ""; if (!t.trim()) { toast("Escreva o aviso"); return; }
  ADM.avisoJSON = montarAvisosNovos(t.trim().replace(/\s+/g, " "), +($("adm-aviso-h") || {}).value || 24); ADM.avisoTexto = t;
  const y = window.scrollY; render(); window.scrollTo(0, y);
};
acoes.admCopiarAviso = () => {
  navigator.clipboard.writeText(ADM.avisoJSON || "").then(() => toast("Copiado! Agora abra o GitHub e cole."))
    .catch(() => { const p = $("adm-aviso-json"); const r = document.createRange(); r.selectNodeContents(p); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Texto selecionado: copie"); });
};
/* publicar direto pelo GitHub com a chave do pai (fica só no aparelho dele, numa chave separada do jogo) */
const PODE_PUBLICAR_DIRETO = /github\.io$|^localhost$|^127\./.test(location.hostname);
const REPO_API = "https://api.github.com/repos/thidesigner/mete-sarrafo/contents/avisos.json";
function chaveGitHub() { try { return localStorage.getItem("ms-adm-chave") || ""; } catch { return ""; } }
const cabecalhos = () => ({ Authorization: "Bearer " + chaveGitHub(), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
const paraBase64 = t => { const b = new TextEncoder().encode(t); let s = ""; b.forEach(x => (s += String.fromCharCode(x))); return btoa(s); };
const deBase64 = t => new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\n/g, "")), c => c.charCodeAt(0)));
/* grava o avisos.json inteiro (avisos + eventos + promoções + presentes), mantendo o que a mudança não mexe */
async function gravarSite(muda, msg) {
  const r = await fetch(REPO_API + "?ref=main&t=" + Date.now(), { headers: cabecalhos(), cache: "no-store" });
  if (r.status === 401 || r.status === 403) throw new Error("A chave não vale mais ou não tem permissão. Crie outra.");
  if (!r.ok) throw new Error("Não consegui ler os avisos (" + r.status + ").");
  const atual = await r.json(); let dados = {};
  try { dados = JSON.parse(deBase64(atual.content)) || {}; } catch {}
  ["avisos", "eventos", "promos", "presentes"].forEach(k => { if (!Array.isArray(dados[k])) dados[k] = []; });
  const novo = muda(dados), limpo = { avisos: novo.avisos || [] };
  ["eventos", "promos", "presentes"].forEach(k => { const v = (novo[k] || []).filter(x => !x.ate || Date.now() <= Date.parse(x.ate)); if (v.length) limpo[k] = v; });
  const w = await fetch(REPO_API, { method: "PUT", headers: { ...cabecalhos(), "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg, content: paraBase64(JSON.stringify(limpo, null, 2) + "\n"), sha: atual.sha, branch: "main" }) });
  if (!w.ok) throw new Error("O GitHub não aceitou (" + w.status + "). Tente de novo.");
  AVISOS.lista = limpo.avisos; EVT.eventos = limpo.eventos || []; EVT.promos = limpo.promos || []; EVT.presentes = limpo.presentes || [];
  aplicarLimitadas();
}
const gravarAvisos = (montar, msg) => gravarSite(d => ({ ...d, avisos: montar(d.avisos) }), msg);
const reRenderAdm = () => { if (G.tela === "adm") { const y = window.scrollY; render(); window.scrollTo(0, y); } };
Object.assign(acoes, {
  async admGuardarChave() {
    const v = ($("adm-chave") || {}).value.trim();
    if (!/^(github_pat_|ghp_)[A-Za-z0-9_]{20,}$/.test(v)) { ADM.chaveStatus = "Isso não parece uma chave do GitHub (começa com github_pat_)."; reRenderAdm(); return; }
    ADM.chaveStatus = "Conferindo a chave…"; reRenderAdm();
    try {
      const r = await fetch(REPO_API + "?ref=main", { headers: { Authorization: "Bearer " + v, Accept: "application/vnd.github+json" }, cache: "no-store" });
      if (!r.ok) { ADM.chaveStatus = r.status === 404 ? "A chave não enxerga o mete-sarrafo. Confira o passo 3." : "A chave não funcionou (" + r.status + ")."; reRenderAdm(); return; }
      try { localStorage.setItem("ms-adm-chave", v); } catch { ADM.chaveStatus = "Este navegador não deixou guardar."; reRenderAdm(); return; }
      ADM.chaveStatus = ""; toast("Chave guardada! Agora é só escrever e publicar."); reRenderAdm();
    } catch { ADM.chaveStatus = "Sem internet para conferir a chave."; reRenderAdm(); }
  },

  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

  if (tipo === "fundo") { const f = FUNDOS.find(([fk]) => fk === k); return f ? "o fundo " + f[1] : ""; }
  if (!x) return "";

  if (tem()) return { txt, jaTem: true };

    arremesso: () => { G.inv[nome].arremessos = [...(G.inv[nome].arremessos || []), k]; }, avatar: () => { G.inv[nome].avatares = [...(G.inv[nome].avatares || []), k]; } })[tipo]();
