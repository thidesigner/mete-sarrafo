<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3057">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}.faixa-teste{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:50;background:#ff4d6d;color:#fff;font:800 12px/1 system-ui,sans-serif;letter-spacing:.08em;padding:4px 10px;border-radius:0 0 8px 8px;pointer-events:none}</style>
<title>Jogo de Pergunta: Modo Festa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tela de quadra, um celular como juiz. Uma tela por momento do jogo, botões grandes para usar em pé e correndo.
   Visual de tema único (quadra azul à noite), escolhido de propósito: fica igual no claro e no escuro. */
:root {
  --court: #0f3057;
  --court-2: #133a68;
  --panel: #18487f;
  --chalk: #f4f7fb;
  --chalk-dim: #b8c6da;
  --lines: rgba(244, 247, 251, .22);
  --ball: #ff8a1f;
  --ball-ink: #2a1300;
  --hit: #ff4d6d;
  --ok: #37d99a;
  --coin: #ffd23f;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--court);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 118px, var(--lines) 119px 121px, transparent 122px),
    linear-gradient(90deg, transparent calc(50% - 1px), var(--lines) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px));
  background-attachment: fixed;
  color: var(--chalk);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; line-height: 1.05; text-wrap: balance; }
h1 { font-size: clamp(34px, 11vw, 52px); }
h1 em { font-style: normal; color: var(--ball); }
h2 { font-size: clamp(24px, 7vw, 32px); }
h3 { font-size: 18px; }
p { margin: 0; }
.dim { color: var(--chalk-dim); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); }
.card { background: var(--court-2); border: 2px solid var(--lines); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.hot { border-color: var(--ball); }
button { font: inherit; cursor: pointer; color: inherit; }
.btn {
  font-family: var(--display); font-size: 18px; letter-spacing: .02em; min-height: 56px; padding: 12px 18px;
  border-radius: 12px; border: 0; background: var(--ball); color: var(--ball-ink); width: 100%;
  box-shadow: 0 4px 0 #b85800;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b85800; }
.btn.ok { background: var(--ok); color: #03281a; box-shadow: 0 4px 0 #1c8c60; }
.btn.no { background: var(--hit); color: #2b0009; box-shadow: 0 4px 0 #a32741; }
.btn.ghost { background: transparent; color: var(--chalk); border: 2px solid var(--lines); box-shadow: none; }
.btn.small { min-height: 44px; font-size: 15px; padding: 8px 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input, select, textarea {
  font: inherit; font-size: 17px; color: var(--chalk); background: var(--court); border: 2px solid var(--lines);
  border-radius: 10px; padding: 12px; width: 100%;
}
textarea { min-height: 80px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--coin); outline-offset: 2px; }
label { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk-dim); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--panel); border: 2px solid var(--lines); font-weight: 700; }
.chip button { background: none; border: 0; color: var(--chalk-dim); font-size: 18px; line-height: 1; padding: 0 2px; }
.chip.pick { cursor: pointer; }
.chip.pick[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.seat { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); }
.word { font-family: var(--display); font-size: clamp(28px, 9vw, 44px); letter-spacing: .12em; text-align: center; overflow-wrap: anywhere; }
.tema { text-align: center; font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--coin); }
.big-name { font-family: var(--display); font-size: clamp(30px, 10vw, 48px); text-align: center; color: var(--ball); overflow-wrap: anywhere; }
.timer { width: 120px; height: 120px; margin: 0 auto; position: relative; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer .n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 40px; font-variant-numeric: tabular-nums; }
.timer.low .n { color: var(--hit); }
.recharge {
  width: min(220px, 70vw); aspect-ratio: 1; margin: 0 auto; border-radius: 50%; border: 0; display: grid; place-items: center;
  font-family: var(--display); font-size: 26px; background: var(--ball); color: var(--ball-ink); box-shadow: 0 6px 0 #b85800;
}
.recharge[disabled] { background: var(--panel); color: var(--chalk-dim); box-shadow: none; cursor: not-allowed; }
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.target { background: var(--panel); border: 2px solid var(--lines); border-radius: 12px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 72px; }
.target b { font-size: 18px; overflow-wrap: anywhere; }
.target.hitnow { border-color: var(--hit); }
.hearts { color: var(--hit); letter-spacing: 2px; font-size: 15px; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th { text-align: left; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk-dim); padding: 6px 4px; border-bottom: 2px solid var(--lines); }
table.score td { padding: 8px 4px; border-bottom: 1px solid var(--lines); }
table.score td.num, table.score th.num { text-align: right; }
table.score tr.out td { opacity: .5; }
.coin { color: var(--coin); }
.scorebar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.scorebar::-webkit-scrollbar { display: none; }
.mini { flex: none; background: var(--court-2); border: 2px solid var(--lines); border-radius: 10px; padding: 6px 10px; font-size: 14px; display: flex; flex-direction: column; min-width: 84px; }
.mini.now { border-color: var(--ball); }
.mini.out { opacity: .45; }
.mini b { overflow-wrap: anywhere; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.top .clock { font-family: var(--mono); font-size: 14px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--chalk-dim); text-decoration: underline; font-size: 15px; padding: 6px 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--chalk); color: var(--court); padding: 10px 16px; border-radius: 10px; font-weight: 800; z-index: 30; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast button { background: var(--court); color: var(--chalk); border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 800; }
.stars { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.stars button { min-height: 64px; border-radius: 12px; border: 2px solid var(--lines); background: var(--panel); font-size: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.stars button small { font-size: 11px; font-family: var(--mono); color: var(--chalk-dim); }
.stars button[aria-pressed="true"] { background: var(--coin); border-color: var(--coin); color: #2a2100; }
.stars button[aria-pressed="true"] small { color: #2a2100; }
.sug { border-left: 4px solid var(--coin); padding: 6px 0 6px 12px; display: flex; flex-direction: column; gap: 4px; }
.sug .meta { font-family: var(--mono); font-size: 12px; color: var(--chalk-dim); }
.sug p { white-space: pre-wrap; overflow-wrap: anywhere; }
.qr { background: #ffffff; padding: 12px; border-radius: 12px; width: fit-content; margin: 0 auto; }
.qr img, .qr canvas { display: block; width: 200px !important; height: 200px !important; }
.url { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; text-align: center; color: var(--chalk-dim); user-select: all; }
ol.rules { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.knobs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
details summary { cursor: pointer; font-family: var(--display); font-size: 16px; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--court); border-radius: 10px; padding: 12px; }
.flash { animation: flash .5s ease-out; }
@keyframes flash { from { background: var(--hit); } to { background: var(--panel); } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } .btn:active { transform: none; } }
/* Arena dos bonequinhos */
.arena { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.a-hud { gap: 4px; padding: 12px; }
.a-hud .word { font-size: clamp(22px, 7vw, 34px); }
.a-emo { display: flex; gap: 6px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.a-emo button { flex: 0 0 auto; font-size: 26px; line-height: 1; width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--lines); background: rgba(11,27,51,.55); cursor: pointer; }
.a-emo button:disabled { opacity: .4; }
.a-emo-eu { position: absolute; left: 50%; top: 38%; font-size: 84px; transform: translate(-50%, -50%) scale(0); pointer-events: none; z-index: 3; opacity: 0; }
.a-emo-eu.mostra { animation: emoEu 1.6s ease-out; }
@keyframes emoEu { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -60%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80%) scale(.9); } }
.ge-prev { width: 100%; aspect-ratio: 1.3; display: block; }
.a-emo button.ge { border-color: #9b51e0; background: rgba(155,81,224,.25); }
.a-emo .sep { flex: 0 0 2px; background: var(--lines); margin: 6px 2px; border-radius: 2px; }
.em-art { font-size: 46px; line-height: 1.3; text-align: center; }
.stage-wrap { position: relative; border-radius: 14px; overflow: hidden; border: 2px solid var(--lines); touch-action: none; }
#a-canvas { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.overlay { position: absolute; inset: 0; z-index: 5; background: rgba(15, 48, 87, .94); display: flex; flex-direction: column; justify-content: center; align-items: stretch; gap: 12px; padding: 20px; overflow-y: auto; text-align: center; }
.overlay .chips { justify-content: center; }
.a-act { min-height: 64px; }
.a-act .row { align-items: center; }
.bar { height: 10px; border-radius: 6px; background: var(--panel); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ball); width: 0; }
.seg2 { display: inline-flex; border: 2px solid var(--lines); border-radius: 10px; overflow: hidden; flex: none; }
.seg2 button { border: 0; background: transparent; padding: 8px 12px; font-weight: 800; color: var(--chalk-dim); }
.seg2 button[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); }
.plist { display: flex; flex-direction: column; gap: 8px; }
.plist .prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border-radius: 10px; padding: 8px 10px; }
.plist .prow b { overflow-wrap: anywhere; min-width: 0; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper .btn { width: 56px; flex: none; }
.stepper b { font-family: var(--display); font-size: 28px; min-width: 2ch; text-align: center; }
.vote-chips .chip { cursor: pointer; }
#a-3d { display: block; width: 100%; touch-action: none; }
.fp-ui { position: absolute; inset: 0; z-index: 2; touch-action: none; user-select: none; -webkit-user-select: none; }
.fp-mira { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid var(--ball); border-radius: 50%; pointer-events: none; }
.fp-joy { position: absolute; left: 18px; bottom: 18px; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(244,247,251,.5); background: rgba(15,48,87,.35); pointer-events: none; }
.fp-knob { position: absolute; left: 35px; top: 35px; width: 50px; height: 50px; border-radius: 50%; background: rgba(244,247,251,.85); }
.fp-tiro { position: absolute; right: 16px; bottom: 16px; width: 104px; height: 104px; border-radius: 50%; border: 0; background: var(--ball); color: var(--ball-ink); font-family: var(--display); font-size: 18px; box-shadow: 0 5px 0 #b85800; }
.fp-tiro:disabled { background: var(--panel); color: var(--chalk-dim); box-shadow: none; }
.fp-dica { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(15,48,87,.8); padding: 4px 12px; border-radius: 999px; font-size: 13px; pointer-events: none; }
/* Tela inicial estilo Brawl: céu azul, botões amarelos grossos com contorno escuro */
.lobby {
  position: relative; isolation: isolate; border-radius: 18px; overflow: hidden; border: 3px solid #0b1b33;
  min-height: min(800px, calc(100dvh - 40px)); padding: 14px; display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(180deg, #1565c0 0%, #42a5f5 48%, #7e57c2 100%);
}
.lobby::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 16px, transparent 16px 32px); }
.lb-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.lb-pill { display: inline-flex; align-items: center; gap: 8px; background: rgba(11,27,51,.6); border: 2px solid #0b1b33; border-radius: 12px; padding: 6px 12px 6px 6px; color: #fff; font-weight: 800; min-height: 48px; min-width: 0; }
button.lb-pill { cursor: pointer; padding-left: 12px; }
.lb-perfil { padding-left: 6px !important; }
.lb-avatar { width: 38px; height: 38px; border-radius: 9px; background: #e4572e; border: 2px solid #0b1b33; display: grid; place-items: center; font-family: var(--display); font-size: 20px; flex: none; }
.lb-pinfo { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1; min-width: 0; }
.lb-pinfo b { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.lb-pinfo span { font-size: 13px; color: #ffd23f; white-space: nowrap; }
.lb-perfil { min-width: 0; flex: 0 1 auto; }
.adm h3 { margin-top: 6px; }
.adm-chip { cursor: pointer; }
.adm-chip[aria-pressed="true"] { background: #37d99a; color: #03281a; border-color: #0b1b33; }
.adm-chip:disabled { opacity: .55; cursor: default; }
.adm-moedas { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); font-size: 40px; color: #ffd23f; }
.adm-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; }
.adm-lim { display: grid; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(244,247,251,.15); }
.adm-tab { width: 100%; border-collapse: collapse; font-size: 15px; }
.adm-tab td { padding: 6px 0; border-bottom: 1px solid rgba(244,247,251,.12); vertical-align: top; }
.adm-tab td:last-child { text-align: right; padding-left: 10px; color: #ffd23f; font-weight: 800; white-space: nowrap; }
.adm-kpi > div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px; display: grid; text-align: center; }
.adm-kpi b { font-family: var(--display); font-size: 28px; color: #ffd23f; }
.adm-kpi span { font-size: 12px; }
.lb-dir { flex: none; }
@media (max-width: 380px) { .lb-perfil .lb-avatar { display: none; } .lb-perfil { padding-left: 10px !important; } .lb-pinfo b { max-width: 22vw; } }
.som-mini { background: none; border: 0; font-size: 20px; padding: 4px 6px; line-height: 1; }
.top .som-mini { margin-left: auto; }
.lb-vidas { padding: 6px 10px; gap: 5px; } .lb-vidas span { color: #ff4d6d; font-size: 18px; } .lb-vidas b { font-family: var(--display); font-size: 18px; }
.lb-oferta { display: grid; grid-template-columns: 96px 1fr; gap: 10px 12px; align-items: center; background: rgba(11,27,51,.65); border: 3px solid #ffd23f; border-radius: 16px; padding: 12px; color: #fff; }
.lb-oferta .lb-item-art { aspect-ratio: 1; filter: none; }
.lb-oferta-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lb-oferta-txt > b { font-family: var(--display); font-size: 20px; }
.lb-oferta-txt span { font-size: 14px; color: #dbe6f5; }
.lb-tenho b { color: #ffd23f; font-size: 16px; }
.lb-comprar { grid-column: 1 / -1; min-height: 56px; border-radius: 12px; border: 3px solid #0b1b33; background: linear-gradient(180deg, #7ee8a8, #37d99a); color: #fff; font-family: var(--display); font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 8px;
  -webkit-text-stroke: 1.5px #0b1b33; paint-order: stroke fill; box-shadow: 0 5px 0 #0b1b33; }
.lb-comprar .lb-coin { -webkit-text-stroke: 0; }
.lb-comprar:disabled { background: #5b6b84; font-size: 17px; cursor: not-allowed; }
.lb-comprar:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #0b1b33; }
.lb-itens.lb-itens3 { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lb-oferta .lb-item-art svg { width: 60%; height: 60%; }
.lb-itens3 .lb-item { padding: 8px; } .lb-itens3 .lb-item b { font-size: 14px; } .lb-itens3 .lb-item span { font-size: 11px; text-align: center; }

/* Fundos da tela inicial */
.bgf { position: relative; isolation: isolate; }
.bgf::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.bgf[data-fundo="basico"] { background: linear-gradient(180deg, #2a3d5c 0%, #1a2a42 100%); }
.bgf[data-fundo="basico"]::before { background: none; }
.bgf[data-fundo="ceu"] { background: linear-gradient(180deg, #1565c0 0%, #42a5f5 48%, #7e57c2 100%); }
.bgf[data-fundo="ceu"]::before { background: repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 16px, transparent 16px 32px); }
.bgf[data-fundo="por"] { background: radial-gradient(circle at 50% 104%, #ffe08a 0 16%, #ffb347 16.5% 22%, transparent 22.5%), linear-gradient(180deg, #2d1b69 0%, #b33771 42%, #ff7e5f 74%, #feb47b 100%); }
.bgf[data-fundo="por"]::before { background: repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 3px, transparent 3px 20px); }
.bgf[data-fundo="noite"] { background: radial-gradient(circle at 82% 11%, #fff6d5 0 4.5%, rgba(255,246,213,.22) 5% 8%, transparent 8.5%), linear-gradient(180deg, #050b24 0%, #14245a 62%, #2b1d5c 100%); }
.bgf[data-fundo="noite"]::before { background-image:
  radial-gradient(1.6px 1.6px at 12% 18%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 30% 62%, #fff 50%, transparent 52%),
  radial-gradient(2px 2px at 52% 30%, #ffe9a8 50%, transparent 52%), radial-gradient(1.3px 1.3px at 70% 78%, #fff 50%, transparent 52%),
  radial-gradient(1.7px 1.7px at 88% 44%, #fff 50%, transparent 52%), radial-gradient(1.1px 1.1px at 40% 90%, #cfe0ff 50%, transparent 52%);
  background-size: 210px 210px; }
.bgf[data-fundo="quadra"] { background: linear-gradient(180deg, #1f8a4f 0%, #166b3c 100%); }
.bgf[data-fundo="quadra"]::before { background:
  radial-gradient(circle at 50% 56%, transparent 0 84px, rgba(255,255,255,.55) 85px 89px, transparent 90px),
  linear-gradient(0deg, transparent calc(56% - 2px), rgba(255,255,255,.55) calc(56% - 2px) calc(56% + 2px), transparent calc(56% + 2px)),
  repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 40px, transparent 40px 80px); }
.bgf[data-fundo="floresta"] { background: linear-gradient(180deg, #0c3326 0%, #1f7a4d 55%, #7cc46a 100%); }
.bgf[data-fundo="floresta"]::before { background:
  repeating-linear-gradient(112deg, rgba(255,255,200,.09) 0 26px, transparent 26px 92px),

function ir(tela) { if (!["inicio", "convidado", "lobby", "loja", "perfil", "fundos", "cadeado", "ajustes"].includes(G.tela)) G.telaAntes = G.tela; G.tela = tela; salvar(); render(); window.scrollTo(0, 0); }
function evento(tipo, extra) { if (!G.p) return; G.p.eventos.push({ t: agora() - G.p.inicio, tipo, ...extra }); if (G.p.eventos.length > 400) G.p.eventos.shift(); }
function vivos() { return G.j.filter(p => p.vivo); }
/* Cada partida começa com 0 moedas (p.moedas = o que ganhou na partida). As moedas da tela inicial
   ficam guardadas (p.guardado) e só servem para comprar vida extra na hora. No fim, o que ganhou é somado. */
const saldoCompra = p => (p.humano === false ? p.moedas : p.guardado || 0);
function pagarVida(p, preco) {
  if (p.humano === false) { p.moedas -= preco; return; }   // robô paga com o que ganhou na partida
  p.guardado = Math.round(((p.guardado || 0) - preco) * 10) / 10;
  if (!p.remoto) { G.banco[p.nome] = Math.round(((G.banco[p.nome] || 0) - preco) * 10) / 10; salvarPlacar(); }   // desconta na hora
}
/* partida com bola de verdade salva antes desta mudança: separa o guardado do que ganhou */
if (G.j) G.j.forEach(p => { if (p.guardado == null) { p.guardado = Math.max(0, Math.round((p.moedas - p.ganho) * 10) / 10); p.moedas = p.ganho; } });
function guardarGanhos(p) { G.banco[p.nome] = Math.round(((G.banco[p.nome] || 0) + Math.max(0, p.moedas)) * 10) / 10; }
function ganhar(p, v, tipo) { p.moedas += v; p.ganho += v; if (G.p) G.p.moedas[tipo] = (G.p.moedas[tipo] || 0) + v; }

let toastT = null;
function toast(txt, acao, fn) {
  const t = $("toast"); t.innerHTML = ""; const s = document.createElement("span"); s.textContent = txt; t.append(s);
  if (acao) { const b = document.createElement("button"); b.textContent = acao; b.onclick = () => { t.hidden = true; fn(); }; t.append(b); }
  t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, acao ? 5000 : 2200);
}
let audio = null;
function bip(freq = 880, dur = .12) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.15, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur);
  } catch {}
}
function vibrar(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }

/* ---------- Partida ---------- */
function comecarPartida() {
  const c = G.cfg;
  G.j = G.nomes.map((nome, i) => ({ i, nome, vidas: c.vidas, vivo: true, moedas: 0, guardado: G.banco[nome] || 0, ganho: 0, compradas: 0, saiuEm: null }));
  G.p = { inicio: agora(), palavras: 0, acertos: 0, erros: 0, timeouts: 0, votos: 0, votosOk: 0, arremessos: 0, acertosBola: 0, rodadas: 0, compras: 0, dicas: 0, moedas: {}, eventos: [] };
  G.perg = null; ir("sorteio");
}
function definirPerguntador(i) { G.perg = i; G.segredoAberto = false; evento("perguntador", { quem: G.j[i].nome }); ir("segredo"); }
function iniciarRodada() {
  const n = G.j.length;
  G.ordem = [];
  for (let k = 1; k < n; k++) { const p = G.j[(G.perg + k) % n]; if (p.vivo) G.ordem.push(p.i); }
  G.vez = 0; G.voltas = 0; G.p.palavras++;
  evento("palavra", { tema: G.tema, tamanho: G.palavra.length });
  if (!G.ordem.length) { terminar(G.perg); return; }
  comecarVez(); ir("pergunta");
}
function comecarVez() { G.prazo = agora() + G.cfg.tempo * 1000; G.pausa = null; salvar(); }
function mascara() { return [...G.palavra].map((c, i) => c === " " ? " " : (G.rev.includes(i) ? c : "_")).join(" "); }
function revelarLetra(c) { [...G.palavra].forEach((ch, i) => { if (ch === c && !G.rev.includes(i)) G.rev.push(i); }); }

function respondeu(certo, timeout) {
  const p = G.j[G.ordem[G.vez]], perg = G.j[G.perg];
  if (certo) {
    ganhar(p, G.cfg.mAcerto, "acerto"); G.p.acertos++;
    evento("acerto", { quem: p.nome, segundos: Math.round((G.cfg.tempo * 1000 - (G.prazo - agora())) / 1000) });
    bip(1100, .2); vibrar(80);
    G.atir = p.i; G.atingidos = []; G.recargaAte = 0; G.ultimoHit = null;
    ir("bola"); return;
  }
  ganhar(perg, G.cfg.mErro, "erro"); G.p.erros++; if (timeout) G.p.timeouts++;
  evento(timeout ? "tempo" : "erro", { quem: p.nome });
  toast(timeout ? `${p.nome}: acabou o tempo. Perdeu a vez.` : `${p.nome} errou e perdeu a vez.`);
  G.vez++;
  if (G.vez >= G.ordem.length) { G.vez = 0; G.voltas++; ir("volta"); return; }
  comecarVez(); render();
}
function atingir(i) {
  const p = G.j[i];
  if (!p.vivo) return;
  p.vidas--; G.p.acertosBola++; if (!G.atingidos.includes(i)) G.atingidos.push(i);
  G.ultimoHit = i; evento("bolada", { em: p.nome, por: G.j[G.atir].nome });
  vibrar([60, 40, 60]); bip(300, .25);
  if (p.vidas <= 0) {
    if (p.compradas < G.cfg.maxCompra && (saldoCompra(p) >= G.cfg.preco || invVidas(p.nome) > 0)) { G.compra = i; ir("compra"); return; }
    eliminar(i); return;
  }
  salvar(); render();
  toast(`${p.nome} perdeu 1 vida`, "Desfazer", () => desfazerHit(i));
}
function desfazerHit(i) {
  const p = G.j[i]; p.vidas++; G.p.acertosBola--; G.atingidos = G.atingidos.filter(x => x !== i);
  evento("desfazer", { em: p.nome }); salvar(); render();
}
function eliminar(i) {
  const p = G.j[i]; p.vivo = false; p.saiuEm = agora() - G.p.inicio; evento("saiu", { quem: p.nome });
  const v = vivos();
  if (v.length === 1) { terminar(v[0].i); return; }
  salvar(); ir("bola"); toast(`${p.nome} saiu do jogo`);
}
function fimDaBola() {
  const atir = G.j[G.atir];
  const sobrev = vivos().filter(p => p.i !== G.atir && !G.atingidos.includes(p.i));
  sobrev.forEach(p => ganhar(p, G.cfg.mSobreviver, "sobreviver"));
  G.p.rodadas++;
  evento("rodada", { atirador: atir.nome, atingidos: G.atingidos.length, sobreviveram: sobrev.length });
  toast(`${sobrev.length} sobreviveram (+${fmtM(G.cfg.mSobreviver)} moedas cada)`);
  definirPerguntador(G.atir);
}
async function terminar(vencedor) {
  G.p.fim = agora(); G.p.vencedor = G.j[vencedor].nome;
  G.vitorias = G.vitorias || {}; G.vitorias[G.p.vencedor] = (G.vitorias[G.p.vencedor] || 0) + 1;
  evento("fim", { vencedor: G.p.vencedor });
  G.j.forEach(guardarGanhos);
  sfxVitoria();
  ir("fim");
  if (db && podeGravar) {
    try {
      const ref = await db.collection("partidas").add({
        em: G.p.inicio, duracaoSeg: Math.round((G.p.fim - G.p.inicio) / 1000), vencedor: G.p.vencedor, cfg: G.cfg,
        jogadores: G.j.map(p => ({ nome: p.nome, vidas: p.vidas, ganho: Math.round(p.ganho * 10) / 10, moedas: Math.round(p.moedas * 10) / 10, compradas: p.compradas, saiuEmSeg: p.saiuEm ? Math.round(p.saiuEm / 1000) : null })),
        stats: { palavras: G.p.palavras, acertos: G.p.acertos, erros: G.p.erros, timeouts: G.p.timeouts, votos: G.p.votos, votosOk: G.p.votosOk, arremessos: G.p.arremessos, acertosBola: G.p.acertosBola, rodadas: G.p.rodadas, compras: G.p.compras, dicas: G.p.dicas, moedas: G.p.moedas },
        eventos: G.p.eventos,
      });
      G.p.id = ref.id; salvar();
      await salvarPlacar();
    } catch { toast("A partida não foi salva na nuvem, só neste aparelho."); }
  }
}

/* ---------- Telas ---------- */
const TELAS = {};
function render() {
  const app = $("app");
  app.innerHTML = (TELAS[G.tela] || TELAS.inicio)();
  ligar(app);
  depois();
}
let depoisFn = null;
function depois() { if (depoisFn) { const f = depoisFn; depoisFn = null; f(); } }
const acoes = {};
function ligar(root) {
  root.querySelectorAll("[data-a]").forEach(el => {
    const ev = el.tagName === "FORM" ? "submit" : "click";
    el.addEventListener(ev, e => { if (ev === "submit") e.preventDefault(); const f = acoes[el.dataset.a]; if (f) f(el, e); });
  });
}
function barra() {
  const atual = G.tela === "bola" ? G.atir : (G.tela === "pergunta" ? G.ordem[G.vez] : null);
  return `<div class="scorebar">${G.j.map(p => `
    <div class="mini${p.vivo ? "" : " out"}${p.i === atual ? " now" : ""}">
      <b>${esc(p.nome)}${p.i === G.perg && G.tela !== "bola" ? " ?" : ""}</b>
      <span class="hearts">${p.vivo ? "●".repeat(Math.min(10, p.vidas)) : "fora"}</span>
      <span class="coin">${fmtM(p.moedas)}</span>
    </div>`).join("")}</div>`;
}
function topo(titulo) {
  return `<div class="top"><span class="eyebrow">${esc(titulo)}</span><span class="clock" id="clock">${G.p ? fmtT(agora() - G.p.inicio) : ""}</span></div>`;
}

TELAS.compra = () => {

    ${topo("Última vida")}

    <button class="btn no" data-a="naoComprar">Sair do jogo</button>`;
};

TELAS.fim = () => {
  const dur = (G.p.fim || agora()) - G.p.inicio;
  const ord = [...G.j].sort((a, b) => (b.vivo - a.vivo) || ((b.saiuEm || 0) - (a.saiuEm || 0)));
  return `
    <span class="eyebrow">Fim de partida · ${fmtT(dur)}</span>
    <div style="text-align:center"><p class="dim">Quem sobrou por último</p><div class="big-name">${esc(G.p.vencedor)}</div><h2>venceu!</h2></div>
    <div class="card">
      <table class="score"><thead><tr><th>Jogador</th><th class="num">Ganhou</th><th class="num">Guardadas</th></tr></thead>
      <tbody>${ord.map(p => `<tr class="${p.vivo ? "" : "out"}"><td>${esc(p.nome)}${p.compradas ? ` <span class="dim">(+${p.compradas} vida)</span>` : ""}</td><td class="num coin">+${fmtM(p.ganho)}</td><td class="num">${fmtM(G.banco[p.nome] || 0)}</td></tr>`).join("")}</tbody></table>
      <p class="dim" style="font-size:14px">${G.p.palavras} palavras · ${G.p.acertos} acertos · ${G.p.erros} chutes errados · ${G.p.arremessos} arremessos, ${G.p.acertosBola} na mosca · ${G.p.votos} votações</p>

TELAS.sugestao = () => {

      <div class="card hot" style="text-align:center">
        <p class="dim">Passe o celular para</p>

  return `

    <form class="card" data-a="sugEnviar" autocomplete="off">

      <div class="field"><label>Quão divertido foi?</label>
        <div class="stars">${NOTAS.map(([e, t], i) => `<button type="button" data-a="nota" data-n="${i + 1}" aria-pressed="${s.nota === i + 1}" aria-label="${t}">${e}<small>${t}</small></button>`).join("")}</div>
      </div>
      <div class="field"><label for="sg-legal">O que foi mais legal?</label><textarea id="sg-legal" maxlength="500">${esc(s.legal || "")}</textarea></div>
      <div class="field"><label for="sg-mudaria">O que você mudaria no jogo?</label><textarea id="sg-mudaria" maxlength="800">${esc(s.mudaria || "")}</textarea></div>
      <button class="btn" type="submit">Enviar</button>

};

TELAS.obrigado = () => `
  <div class="card hot" style="text-align:center"><h2>Valeu, turma!</h2><p class="dim">As sugestões foram guardadas para o Andre melhorar o jogo.</p></div>
  <button class="btn" data-a="revanche">Jogar de novo</button>
  <button class="btn ghost" data-a="mais">Ver as sugestões</button>
  <button class="btn ghost small" data-a="inicio">Tela inicial</button>`;

TELAS.convidado = () => `
  <header style="display:flex;flex-direction:column;gap:8px">
    <span class="eyebrow">Jogo do Andre</span>
    <h1>Jogo de <em>Pergunta</em></h1>
    <p class="dim">Forca com queimada. O jogo acontece no celular do Andre, que é o juiz. Aqui estão as regras.</p>
  </header>
  <div class="card"><h3>Regras</h3>${regrasHTML()}</div>
  <div class="card"><h3>Quer dar uma ideia?</h3><p class="dim">No fim de cada partida o celular do Andre passa de mão em mão. É lá que você deixa sua nota e sua sugestão.</p></div>`;

/* ---------- Ações ---------- */
Object.assign(acoes, {
  addNome() {
    const inp = $("nome"); const n = inp.value.trim().replace(/\s+/g, " ");
    if (!n) return;
    if (G.nomes.some(x => x.toLowerCase() === n.toLowerCase())) { toast("Esse nome já está na lista"); return; }
    if (G.nomes.length >= 20) { toast("Máximo de 20 jogadores"); return; }
    G.nomes.push(n); salvar(); render(); $("nome").focus();
  },
  tirar(el) { G.nomes.splice(+el.dataset.i, 1); salvar(); render(); },
  copiarSug(el) {
    const txt = "Sugestões do Jogo de Pergunta\n\n" + sugestoes.map(s => `${s.nome || "Alguém"} (${s.nota ? NOTAS[s.nota - 1][1] : "sem nota"})` + (s.legal ? `\nMais legal: ${s.legal}` : "") + (s.mudaria ? `\nMudaria: ${s.mudaria}` : "")).join("\n\n");
    const mostrar = () => { const ta = $("sug-texto"); if (ta) { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); } toast("Selecionei o texto: é só copiar"); };
    try { navigator.clipboard.writeText(txt).then(() => { el.textContent = "Copiado!"; toast("Copiado. Agora cole no WhatsApp"); }, mostrar); } catch { mostrar(); }
  },
  comecar() { G.ultimoModo = "juiz"; comecarPartida(); },
  arena() { abrirArena(); },
  continuar() { ir(G.telaAntes || "pergunta"); },
  descartar() { G.p = null; G.j = []; salvar(); render(); },
  cfgPadrao() { G.cfg = { ...PADRAO }; salvar(); render(); },
  alternarImprimir(el) { if (!ajustesAbertos) return; G.imprimir3d = el.checked; salvar(); toast(el.checked ? "Imprimir 3D ligado neste aparelho" : "Imprimir 3D escondido"); },
  sortear() { definirPerguntador(Math.floor(Math.random() * G.j.length)); },
  escolherPerg(el) {
    const i = +el.dataset.i;
    if (G.tela === "novoPerg") evento("trocaVoto", { para: G.j[i].nome });
    definirPerguntador(i);
  },
  abrirSegredo() { G.segredoAberto = true; G.palavra = ""; G.rev = []; G.tema = ""; salvar(); render(); setTimeout(() => $("palavra") && $("palavra").focus(), 50); },
  tema(el) { G.tema = el.dataset.t; guardarCamposSegredo(true); },
  letra(el) { guardarCamposSegredo(); G.rev = []; revelarLetra(el.dataset.c); salvar(); render(); },
  confirmaSegredo() { guardarCamposSegredo(); if (!G.palavra || !G.rev.length) return; G.segredoAberto = false; iniciarRodada(); },
  certo() { respondeu(true); },
  errado() { respondeu(false); },
  pausar() {
    if (G.pausa) { G.prazo = agora() + G.pausa; G.pausa = null; } else { G.pausa = Math.max(0, G.prazo - agora()); }
    salvar(); render();
  },
  dificil() { G.votoDe = G.tela; G.votoSim = 0; G.p.votos++; evento("votoInicio", {}); ir("voto"); },
  votoMais() { G.votoSim = Math.min(G.ordem.length, G.votoSim + 1); salvar(); render(); },
  votoMenos() { G.votoSim = Math.max(0, G.votoSim - 1); salvar(); render(); },
  votoCancelar() { G.p.votos--; ir(G.votoDe || "pergunta"); if (G.tela === "pergunta") comecarVez(); },
  votoFim() {
    const total = G.ordem.length, perg = G.j[G.perg];
    if (G.votoSim > total / 2) {
      const perda = perg.moedas * G.cfg.perdaVoto / 100; perg.moedas -= perda; perg.ganho -= perda;
      G.p.votosOk++; evento("votoPassou", { sim: G.votoSim, total, perg: perg.nome, perda: Math.round(perda * 10) / 10 });
      ir("novoPerg");
    } else {
      evento("votoNaoPassou", { sim: G.votoSim, total });
      if (G.votoDe === "volta") ir("volta"); else { comecarVez(); ir("pergunta"); }
    }
  },
  maisLetra(el) { revelarLetra(el.dataset.c); G.p.dicas++; evento("letra", {}); comecarVez(); ir("pergunta"); },
  dicaFalada() { G.p.dicas++; evento("dica", {}); comecarVez(); ir("pergunta"); },
  atirar() {
    if (agora() < G.recargaAte) return;
    G.p.arremessos++; evento("arremesso", { por: G.j[G.atir].nome });
    G.recargaAte = agora() + G.cfg.recarga * 1000; G.recargaAvisou = false; salvar(); tic();
  },
  hit(el) { atingir(+el.dataset.i); },
  voltaram() { fimDaBola(); },
  comprar() {
    const p = G.j[G.compra]; if (saldoCompra(p) < G.cfg.preco) return; pagarVida(p, G.cfg.preco); p.compradas++; p.vidas = 1; G.p.compras++;
    evento("compra", { quem: p.nome }); G.compra = null; toast(`${p.nome} comprou uma vida extra`); ir("bola");
  },
  naoComprar() { const i = G.compra; G.compra = null; eliminar(i); },
  usarVida() {
    const p = G.j[G.compra]; mudarInv(p.nome, -1); p.compradas++; p.vidas = 1; G.p.compras++;
    evento("usouVida", { quem: p.nome }); G.compra = null; salvarPlacar(); toast(`${p.nome} usou uma vida extra da loja`); ir("bola");
  },
  revanche() { G.sug = null; if (G.ultimoModo === "arena") { $("app").hidden = true; abrirArena(); return; } comecarPartida(); },
  inicio() { G.sug = null; if (G.p && G.p.fim) { G.p = null; G.j = []; } ir("lobby"); },
  sugComecar() { G.sug = { fila: G.j.map(p => p.nome), idx: 0, aberto: false, partidaId: G.p && G.p.id || null }; ir("sugestao"); },
  sugAvulsa() { G.sug = { nome: "" }; ir("sugestao"); },
  sugAbrir() { G.sug.aberto = true; G.sug.nota = 0; G.sug.legal = ""; G.sug.mudaria = ""; salvar(); render(); },
  sugPular() { proximaSug(); },
  nota(el) { guardarCamposSug(); G.sug.nota = +el.dataset.n; salvar(); render(); },
  async sugEnviar() {
    guardarCamposSug();
    const s = G.sug;
    const nome = s.fila ? s.fila[s.idx] : (s.nome || "").trim();
    if (!s.nota && !s.legal.trim() && !s.mudaria.trim()) { toast("Escreva alguma coisa ou toque em uma carinha"); return; }
    const doc = { nome: nome || "Alguém", nota: s.nota || null, legal: s.legal.trim(), mudaria: s.mudaria.trim(), em: agora(), partidaId: s.partidaId || null };
    if (db && podeGravar) {
      try { await db.collection("sugestoes").add(doc); }
      catch { guardarLocal(doc); toast("Sem internet: a sugestão ficou guardada neste aparelho."); }
    } else guardarLocal(doc);
    if (s.fila) proximaSug(); else { G.sug = null; toast("Sugestão enviada. Valeu!"); ir("inicio"); }
  },
  async resumo() {
    const out = $("resumo"); if (!out || !sample) return;
    out.hidden = false; out.textContent = "Lendo as sugestões…";
    const lista = sugestoes.slice(0, 60).map(s => `- ${s.nome || "Alguém"} (nota ${s.nota || "?"}/5). Mais legal: ${s.legal || "-"}. Mudaria: ${s.mudaria || "-"}`).join("\n");
    try {
      const r = await sample(`Estas são sugestões de crianças que jogaram "Jogo de Pergunta", um jogo criado pelo Andre (forca + queimada).
Resuma para o Andre, em português simples e animado, em até 150 palavras, sem markdown:
1) o que a turma mais curtiu, 2) as mudanças mais pedidas (diga quantas pessoas pediram cada uma), 3) uma sugestão de próximo teste.

Sugestões:
${lista}`, { onText: ({ text }) => { out.textContent = text; } });
      out.textContent = r.text;
    } catch (e) {
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) { out.hidden = true; sample = null; }
      else out.textContent = (e && e.text) || "Não deu para resumir agora. Tente de novo daqui a pouco.";
    }
  },
});
function guardarCamposSegredo(rerender) {
  const t = $("tema"), w = $("palavra");
  if (t) G.tema = rerender && G.tema ? G.tema : t.value.trim();
  if (w) {
    const nova = w.value.toUpperCase().replace(/\s+/g, " ").trim();
    if (nova !== G.palavra) { G.palavra = nova; G.rev = []; }
  }
  salvar(); if (rerender) render();
}
function guardarCamposSug() {
  const s = G.sug; if (!s) return;
  if ($("sg-nome")) s.nome = $("sg-nome").value;
  if ($("sg-legal")) s.legal = $("sg-legal").value;
  if ($("sg-mudaria")) s.mudaria = $("sg-mudaria").value;
}
function proximaSug() {
  const s = G.sug; s.idx++; s.aberto = false;
  if (s.idx >= s.fila.length) { G.sug = null; ir("obrigado"); return; }
  salvar(); render();
}
function guardarLocal(doc) {
  try { const a = JSON.parse(localStorage.getItem("ms-sug-pendentes") || "[]"); a.push(doc); localStorage.setItem("ms-sug-pendentes", JSON.stringify(a)); } catch {}
  sugestoes = [doc, ...sugestoes];
}
async function enviarPendentes() {
  if (!db || !podeGravar) return;
  let a = []; try { a = JSON.parse(localStorage.getItem("ms-sug-pendentes") || "[]"); } catch {}
  if (!a.length) return;
  const resto = [];
  for (const d of a) { try { await db.collection("sugestoes").add(d); } catch { resto.push(d); } }
  try { localStorage.setItem("ms-sug-pendentes", JSON.stringify(resto)); } catch {}
}

/* campos que re-renderizam ao mudar */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.k) {
    const v = parseFloat(String(t.value).replace(",", "."));
    if (isFinite(v)) { G.cfg[t.dataset.k] = Math.min(+t.max, Math.max(+t.min, v)); salvar(); }
    render();
  }
  if (t.id === "palavra") { guardarCamposSegredo(); render(); }
  if (t.id === "tema") guardarCamposSegredo();
});
document.addEventListener("input", e => { if (e.target.id === "palavra") { const pos = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); try { e.target.setSelectionRange(pos, pos); } catch {} } });

/* espiar a palavra segurando */
document.addEventListener("pointerdown", e => {
  const el = e.target.closest && e.target.closest('[data-a="espiar"]'); if (!el) return;
  const m = $("mask"); if (m) m.textContent = G.palavra;
  const solta = () => { const mm = $("mask"); if (mm) mm.textContent = mascara(); window.removeEventListener("pointerup", solta); window.removeEventListener("pointercancel", solta); };
  window.addEventListener("pointerup", solta); window.addEventListener("pointercancel", solta);
});

/* ---------- Relógios ---------- */
function tic() {
  if (G.p && $("clock")) $("clock").textContent = fmtT((G.p.fim || agora()) - G.p.inicio);
  if (G.tela === "pergunta") {
    const resta = G.pausa != null ? G.pausa : G.prazo - agora();
    const s = Math.max(0, Math.ceil(resta / 1000));
    const sec = $("secs"), arc = $("arc"), tm = $("timer");
    if (sec) sec.textContent = s;
    if (arc) arc.setAttribute("stroke-dashoffset", String(326.7 * (1 - Math.max(0, resta) / (G.cfg.tempo * 1000))));
    if (tm) tm.classList.toggle("low", s <= 5);
    if (G.pausa == null && resta <= 0) { bip(220, .35); vibrar(200); respondeu(false, true); }
  }
  if (G.tela === "bola") {
    const r = $("recharge"); if (!r) return;
    const falta = G.recargaAte - agora();
    if (falta > 0) { r.disabled = true; r.textContent = (falta / 1000).toFixed(1).replace(".", ",") + " s"; }
    else { if (r.disabled) { bip(1320, .12); } r.disabled = false; r.textContent = "ATIRAR"; }
  }
}
setInterval(tic, 100);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tic(); });

/* ---------- QR ---------- */
function desenharQR() {
  const box = $("qr"); if (!box) return;
  box.innerHTML = "";
  if (typeof QRCode === "undefined" || LINK.endsWith("PENDENTE")) { box.textContent = "QR indisponível"; box.style.color = "#000"; return; }
  try { new QRCode(box, { text: LINK, width: 400, height: 400, colorDark: "#0f3057", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch {}
}

/* ---------- Nuvem ---------- */
if (G.tela === "pergunta" && G.pausa == null) comecarVez();
render();
(async () => {
  if (!window.claude || !window.claude.use) { modoLocal = true; render(); return; }
  const [dbc, user, smp] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]);
  sample = smp;
  let dono = false, escreve = null;
  if (user) { try { dono = await user.isOwner(); escreve = await user.can("data.write"); } catch {} }
  if (dbc) { db = dbc; podeGravar = dono || escreve === true || (escreve === null && !!user); }
  modoLocal = !podeGravar;
  if (G.tela === "convidado") G.tela = "inicio";
  if (db) {
    try {
      const pl = await db.doc("placar/moedas").get();
      if (pl.exists) {
        const d = pl.data() || {};
        if ((d.atualizadaEm || 0) > (G.placarEm || 0)) { Object.assign(G.banco, d.moedas || {}); G.inv = { ...(G.inv || {}), ...(d.inventario || {}) }; G.placarEm = d.atualizadaEm; salvar(); }
        else if ((G.placarEm || 0) > (d.atualizadaEm || 0)) salvarPlacar();
      } else if (G.placarEm) salvarPlacar();
    } catch {}
    db.collection("sugestoes").orderBy("em", "desc").limit(100).onSnapshot(s => {
      sugestoes = s.docs.map(d => d.data() || {});
      if (G.tela === "inicio") { const y = window.scrollY; render(); window.scrollTo(0, y); }
    }, () => {});
    db.collection("partidas").get().then(s => { partidasSalvas = s.size; if (G.tela === "inicio") { const y = window.scrollY; render(); window.scrollTo(0, y); } }).catch(() => {});
    enviarPendentes();
    if (typeof sincronizarPersonagens === "function") sincronizarPersonagens();
  }
  render();
})();
</script>

<script>
/* ================= Arena dos bonequinhos ================= */
const AP = {
  Animais: ["GATO", "CACHORRO", "GIRAFA", "ELEFANTE", "TUBARAO", "CORUJA", "TARTARUGA", "MACACO", "LEAO", "COBRA"],
  Frutas: ["BANANA", "MORANGO", "ABACAXI", "UVA", "MELANCIA", "LARANJA", "MANGA", "LIMAO"],
  Comidas: ["PIZZA", "LASANHA", "PIPOCA", "SORVETE", "COXINHA", "BRIGADEIRO", "HAMBURGUER"],
  Objetos: ["CADEIRA", "MOCHILA", "CELULAR", "TESOURA", "RELOGIO", "LANTERNA", "ESPELHO"],
  Jogos: ["MINECRAFT", "ROBLOX", "FORTNITE", "XADREZ", "QUEIMADA", "FUTEBOL", "DOMINO"],
  Lugares: ["PRAIA", "ESCOLA", "MERCADO", "CINEMA", "FAZENDA", "PARQUE", "HOSPITAL"],
  Profissões: ["MEDICO", "BOMBEIRO", "PROFESSOR", "PILOTO", "COZINHEIRO", "POLICIAL"],

const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z ]/g, "").replace(/\s+/g, " ").trim();

const A = { P: [], cfg: null, cel: 0, ph: null, balls: [], fx: [], t: 0, fim: null, st: null, raf: null, last: 0, ptr: null, keys: {}, ov: false, hudT: 0, inicio: 0,

/* ---------- Partida ---------- */
function comecarArena() {
  const s = A.setup;
  const lista = G.nomes.map(n => ({ nome: n, humano: !s.robo[n] }));
  for (let k = 1; k <= s.extras; k++) lista.push({ nome: "Robô " + k, humano: false });
  const n = lista.length;
  A.cfg = { ...G.cfg };
  A.P = lista.map((o, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    const home = { x: AC + AH * Math.cos(a), y: AC + AH * Math.sin(a) };
    return { i, nome: o.nome, humano: o.humano, cor: A_CORES[i % A_CORES.length], pele: A_PELE[i % A_PELE.length],
      vidas: A.cfg.vidas, vivo: true, moedas: 0, guardado: o.humano ? (G.banco[o.nome] || 0) : 0, ganho: 0, compradas: 0,
      home, x: home.x, y: home.y, alvo: null, modo: "casa", vel: A_VEL * aRnd(.88, 1.12), habil: aRnd(-.08, .08),
      flash: 0, passo: 0, ctrl: false, tocou: false, saiuEm: null };
  });
  A.P.forEach(p => { if (p.humano) { vestir(p, skinDe(p.nome)); const f = personagemDe(p.nome); if (f) p.ficha = f; } });
  A.cel = Math.max(0, A.P.findIndex(p => p.nome === s.dono));
  A.balls = []; A.fx = []; A.t = 0; A.fim = null; A.ptr = null; A.inicio = Date.now();
  A.st = { palavras: 0, acertos: 0, erros: 0, timeouts: 0, votos: 0, votosOk: 0, arremessos: 0, acertosBola: 0, rodadas: 0, compras: 0, moedas: {}, eventos: [] };
  $("a-setup").hidden = true; $("a-game").hidden = false;
  window.scrollTo(0, 0);
  A.fp = false;
  novaPalavraA(aPick(A.P));

  ligarVisao(s.fp !== false);
}
function aEvento(tipo, extra) { A.st.eventos.push({ t: Math.round(A.t * 10) / 10, tipo, ...extra }); if (A.st.eventos.length > 400) A.st.eventos.shift(); }
function aVivos() { return A.P.filter(p => p.vivo); }
function aGanhar(p, v, tipo) { p.moedas += v; p.ganho += v; A.st.moedas[tipo] = (A.st.moedas[tipo] || 0) + v; }
function aFx(x, y, txt, cor) { A.fx.push({ x, y, txt, cor, t: 0 }); }
function aMsg(txt) { $("a-sub").textContent = txt; }

function novaPalavraA(perg) {
  A.ph = { k: "segredo", perg };
  if (perg.humano) { mostrarSegredo(); return; }
  const tema = aPick(Object.keys(AP)), palavra = aPick(AP[tema]);
  comecarPerguntaA(perg, tema, palavra, aPick([...new Set(palavra.replace(/ /g, ""))]));
}
function comecarPerguntaA(perg, tema, palavra, letra) {

  [...palavra].forEach((c, i) => { if (c === letra || c === " ") rev.add(i); });
  const n = A.P.length, ordem = [];
  for (let k = 1; k < n; k++) { const p = A.P[(perg.i + k) % n]; if (p.vivo) ordem.push(p); }
  if (!ordem.length) { terminarA(perg); return; }
  A.ph = { k: "pergunta", perg, tema, palavra, rev, ordem, idx: 0, voltas: 0, votou: false, pensa: 0, prazo: 0, espera: false };
  A.st.palavras++; aEvento("palavra", { perg: perg.nome, tema, palavra });
  aMsg(`${perg.nome} pensou numa palavra. Tema: ${tema}.`);

}
function aMascara(ph) { return [...ph.palavra].map((c, i) => c === " " ? " " : (ph.rev.has(i) ? c : "_")).join(" "); }
function revelarMaisA(ph) {
  const faltam = [...ph.palavra].map((c, i) => ({ c, i })).filter(o => o.c !== " " && !ph.rev.has(o.i));
  if (faltam.length <= 1) return null;

function prepararVez() {

/* ---------- Bola ---------- */
function iniciarBolaA(atir) {
  A.ph = { k: "bola", atir, cd: .6, atingidos: new Set(), palavra: A.ph.palavra, pronto: false, t0: 0 };
  const go = () => {
    const ph = A.ph; ph.pronto = true; ph.t0 = A.t;
    atir.alvo = { x: AC, y: AC }; atir.modo = "centro";
    for (const p of aVivos()) {
      if (p === atir) continue;
      p.tocou = false;
      p.ctrl = p.humano && p.i === A.cel && !atir.humano;
      if (p.ctrl) { p.modo = "fugindo"; p.alvo = null; continue; }
      const a = Math.atan2(p.home.y - AC, p.home.x - AC) + Math.PI + aRnd(-.5, .5);
      p.alvo = { x: AC + AH * Math.cos(a), y: AC + AH * Math.sin(a) }; p.modo = "fugindo";

}
function aCorrendo() { const ph = A.ph; return aVivos().filter(p => p !== ph.atir && (p.modo === "fugindo" || p.modo === "voltando")); }
function arremessarA(to) {
  const ph = A.ph, atir = ph.atir;

}

  aEvento("bolada", { em: p.nome, por: ph.atir.nome });
  if (p.vidas > 0) { aMsg(`${ph.atir.nome} acertou ${p.nome}! Restam ${p.vidas} vidas.`); return; }
  if (p.compradas < A.cfg.maxCompra && (saldoCompra(p) >= A.cfg.preco || (p.humano && invVidas(p.nome) > 0))) {

function comprarA(p) {

function eliminarA(p) {

}
function fimRodadaA(forcado) {
  const ph = A.ph, atir = ph.atir;

  sobrev.forEach(p => aGanhar(p, A.cfg.mSobreviver, "sobreviver"));

  A.st.rodadas++; aEvento("rodada", { atirador: atir.nome, sobreviveram: sobrev.length });
  aMsg(`${forcado ? "Tempo da bola acabou. " : ""}${sobrev.length} ${sobrev.length === 1 ? "sobreviveu" : "sobreviveram"} (+${fmtM(A.cfg.mSobreviver)} moedas). ${atir.nome} vai perguntar.`);

async function terminarA(v) {

  A.balls = [];

  G.historico.push({ em: Date.now(), dur: Math.round(A.t), vencedor: v.nome, jog: A.P.filter(p => p.humano).map(p => p.nome), robos: A.P.filter(p => !p.humano).length,

/* ---------- Passo da simulação ---------- */
function passoA(dt) {
  if (A.fim || A.ov) return;
  A.t += dt;
  const ph = A.ph;
  for (const f of A.fx) f.t += dt;
  A.fx = A.fx.filter(f => f.t < 1.4);
  for (const p of A.P) {
    p.flash = Math.max(0, p.flash - dt);
    if (!p.vivo) continue;
    if (p.ctrl) { moverControlado(p, dt); continue; }
    if (!p.alvo) continue;
    const d = aDist(p, p.alvo), passo = p.vel * dt;
    if (d <= passo) {
      p.x = p.alvo.x; p.y = p.alvo.y; p.alvo = null;
      if (p.modo === "fugindo") { p.modo = "voltando"; p.alvo = { ...p.home }; }
      else if (p.modo === "voltando") p.modo = "casa";
      else if (p.modo === "centro") p.modo = "mira";
    } else { p.x += (p.alvo.x - p.x) / d * passo; p.y += (p.alvo.y - p.y) / d * passo; p.passo += passo; }
  }
  for (const b of A.balls) {
    b.t += dt;
    if (b.t >= b.T && !b.done) {
      b.done = true;
      if (!ph || ph.k !== "bola") continue;
      let best = null, bd = A_RAIO;
      for (const p of aCorrendo()) { const d = aDist(p, b.to); if (d < bd) { bd = d; best = p; } }
      if (best) atingirA(best); else aFx(b.to.x, b.to.y - 20, "errou", "#b8c6da");
      if (A.fim || A.ov) { A.balls = A.balls.filter(x => !x.done); return; }
    }
  }
  A.balls = A.balls.filter(b => !b.done);
  if (!ph) return;
  if (ph.k === "pergunta" && !ph.espera) {
    const p = ph.ordem[ph.idx];
    if (!p.humano) {

function pontoA(e) {
  const r = aCv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * AW, y: (e.clientY - r.top) / r.height * AW };
}
aCv.addEventListener("pointerdown", e => {
  if (A.ov || A.fim) return;
  const ph = A.ph; if (!ph || ph.k !== "bola" || !ph.pronto) return;
  e.preventDefault();
  try { aCv.setPointerCapture(e.pointerId); } catch {}
  const pt = pontoA(e);
  if (ph.atir.humano && ph.atir.i === A.cel) {
    if (ph.atir.modo !== "mira") { aMsg("Espere chegar no meio da quadra."); return; }
    if (ph.cd > 0) { aMsg("Ainda recarregando…"); return; }
    if (!aCorrendo().length) return;
    arremessarA(pt); bip(500, .06);
    return;
  }
  if (A.P.some(p => p.ctrl)) A.ptr = pt;
});

function quadroA(ts) {
  if ($("arena").hidden) { A.raf = null; return; }
  const dt = Math.min(.1, (ts - (A.last || ts)) / 1000); A.last = ts;
  let resto = dt;
  while (resto > 0) { const h = Math.min(.05, resto); passoA(h); resto -= h; }
  if (A.fp && F.ok) desenhar3D(); else desenharA();
  A.hudT += dt; if (A.hudT > .15) { A.hudT = 0; hudA(); }
  A.raf = requestAnimationFrame(quadroA);
}

TELAS.perfil = () => `
  <section data-fundo="${fundoAtual()}" class="bgf lobby" aria-label="Quem está jogando">

Object.assign(acoes, {
  jogar() {
    const modo = G.modo || "fp";
    if (modo === "juiz") { ir("inicio"); return; }

  },

  loja() { ir("loja"); },

  setPerfil() { const n = $("pf-nome").value.trim().replace(/\s+/g, " "); if (!n) return; G.perfil = n; ir("lobby"); },
  escolherPerfil(el) { G.perfil = el.dataset.n; ir("lobby"); },
});

let lbRaf = null, lbT = 0;
function animarLobby() {
  if (lbRaf) cancelAnimationFrame(lbRaf);
  const nome = perfil();
  const boneco = vestir({ i: -1, nome: "", humano: true, cor: A_CORES[0], pele: A_PELE[0], vidas: 0, x: 0, y: 0, passo: 0, flash: 0 }, skinDe(nome));
  boneco.ficha = typeof personagemDe === "function" ? personagemDe(nome) : null;
  const quadro = ts => {
    const cv = $("lb-canvas");
    if (!cv || G.tela !== "lobby" || $("app").hidden) { lbRaf = null; return; }
    lbT = ts / 1000;
    const w = cv.clientWidth, dpr = window.devicePixelRatio || 1, px = Math.round(w * dpr);
    if (!w) { lbRaf = requestAnimationFrame(quadro); return; }
    if (cv.width !== px || cv.height !== px) { cv.width = px; cv.height = px; }
    const c = cv.getContext("2d");
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, px, px);
    const k = px / 200;
    c.setTransform(k, 0, 0, k, 0, 0);
    // plataforma
    const g = c.createRadialGradient(100, 168, 4, 100, 168, 70);
    g.addColorStop(0, "rgba(255,210,63,.55)"); g.addColorStop(1, "rgba(255,210,63,0)");
    c.fillStyle = g; c.beginPath(); c.ellipse(100, 168, 70, 20, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#0b1b33"; c.beginPath(); c.ellipse(100, 166, 44, 11, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#2a6fd6"; c.beginPath(); c.ellipse(100, 163, 44, 11, 0, 0, Math.PI * 2); c.fill();
    // bonequinho respirando e acenando
    const bob = Math.sin(lbT * 2.2) * 2;
    boneco.x = 100; boneco.y = 120 + bob * .4; boneco.passo = Math.sin(lbT * 1.1) * 4;
    c.save(); c.translate(100, 120); c.scale(1.95, 1.95); c.translate(-100, -120);
    desenharBoneco2(c, boneco, {});
    c.restore();
    // bola quicando ao lado
    const q = Math.abs(Math.sin(lbT * 3));
    c.fillStyle = "rgba(0,0,0,.25)"; c.beginPath(); c.ellipse(152, 170, 8 - q * 3, 3, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#ff8a1f"; c.strokeStyle = "#2a1300"; c.lineWidth = 2;
    c.beginPath(); c.arc(152, 160 - q * 34, 9, 0, Math.PI * 2); c.fill(); c.stroke();
    lbRaf = requestAnimationFrame(quadro);
  };
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) lbRaf = requestAnimationFrame(quadro);
  else { lbRaf = requestAnimationFrame(t => { quadro(t); cancelAnimationFrame(lbRaf); lbRaf = null; }); }
}

</script>

<script>
/* ================= Música da tela inicial (original, feita na hora pelo navegador) ================= */
const MUS = { ctx: null, master: null, tocando: false, timer: null, passo: 0, proximo: 0, bpm: 118, volta: 0, noise: null };
const TELAS_COM_MUSICA = ["lobby", "loja", "perfil"];
const somLigado = () => G.som !== false;
const hz = m => 440 * Math.pow(2, (m - 69) / 12);

function musCtx() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    MUS.ctx = audio;
    if (!MUS.master) {
      MUS.master = audio.createGain(); MUS.master.gain.value = 0; MUS.master.connect(audio.destination);
      const n = audio.createBuffer(1, audio.sampleRate * .5, audio.sampleRate), d = n.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      MUS.noise = n;
    }
    if (audio.state === "suspended") audio.resume();
    return audio;
  } catch { return null; }
}

/* G – Em – C – D, 16 passos por compasso */
const ACORDES = [[55, 59, 62], [52, 55, 59], [48, 52, 55], [50, 54, 57]];
const BAIXO = [43, 40, 36, 38];
const MELODIA = [
  [67, null, 71, null, 74, null, 71, null, 72, 74, null, 71, null, 67, null, null],
  [64, null, 67, null, 71, null, 67, null, 69, 71, null, 67, null, 64, null, null],
  [64, null, 67, null, 72, null, 76, null, 74, 72, null, 71, null, 72, null, null],
  [74, null, null, 72, null, 71, null, 69, 66, null, 69, null, 74, null, null, null],
];
const RESPOSTA = [
  [79, 78, 79, null, 74, null, null, null, 76, null, 74, null, 71, null, null, null],
  [76, 74, 76, null, 71, null, null, null, 72, null, 71, null, 67, null, null, null],
  [76, null, 79, null, 84, null, 83, null, 81, null, 79, null, 76, null, 79, null],
  [81, null, 79, null, 78, null, 76, null, 74, null, 76, null, 78, 79, 81, 83],
];

function nota(t, freq, dur, tipo, vol, opts = {}) {
  const c = MUS.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(freq, t);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(freq * opts.slide, t + dur);
  if (opts.vibrato) {
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 6; lg.gain.value = freq * .012; lfo.connect(lg); lg.connect(o.frequency);
    lfo.start(t + .06); lfo.stop(t + dur + .05);
  }
  let saida = o;
  if (opts.filtro) { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = opts.filtro; o.connect(f); saida = f; }
  saida.connect(g); g.connect(MUS.master);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + (opts.ataque || .008));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + .02);
}
function ruido(t, dur, vol, tipo, freq) {
  const c = MUS.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = MUS.noise; f.type = tipo; f.frequency.value = freq;
  s.connect(f); f.connect(g); g.connect(MUS.master);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.start(t, Math.random() * .3); s.stop(t + dur + .02);
}
function bumbo(t) { nota(t, 150, .22, "sine", .9, { slide: .3, ataque: .002 }); }
function palma(t) { ruido(t, .14, .5, "bandpass", 1500); ruido(t + .012, .1, .35, "bandpass", 1100); }
function chimbal(t, aberto) { ruido(t, aberto ? .18 : .045, aberto ? .18 : .14, "highpass", 7000); }

function tocarPasso(i, t) {
  const compasso = Math.floor(i / 16) % 4, p = i % 16, frase = Math.floor(i / 64) % 2;
  const ac = ACORDES[compasso], b = BAIXO[compasso];
  if (p === 0 || p === 8 || (p === 10 && compasso === 3)) bumbo(t);
  if (p === 4 || p === 12) palma(t);
  if (p % 2 === 0) chimbal(t, p === 14);
  if ([0, 3, 6, 8, 11, 14].includes(p)) nota(t, hz(b + (p === 3 || p === 11 ? 12 : 0)), .2, "triangle", .55, { filtro: 900 });
  if (p % 4 === 2) ac.forEach(m => nota(t, hz(m + 12), .12, "square", .045, { filtro: 2400 }));
  const mel = (frase === 0 ? MELODIA : RESPOSTA)[compasso][p];
  if (mel) {
    if (frase === 0) nota(t, hz(mel), .26, "square", .09, { filtro: 3200 });
    else nota(t, hz(mel), .3, "sine", .16, { vibrato: true, ataque: .02 });
  }
  if (i % 128 === 127) { ruido(t, .5, .25, "highpass", 3000); }
}
function agendar() {
  const c = MUS.ctx, dur = 60 / MUS.bpm / 4;
  while (MUS.proximo < c.currentTime + .15) {
    tocarPasso(MUS.passo, MUS.proximo);
    MUS.passo++; MUS.proximo += dur;
  }
}
function musicaTocar() {
  if (MUS.tocando || !somLigado()) return;
  const c = musCtx(); if (!c) return;
  MUS.tocando = true; MUS.passo = 0; MUS.proximo = c.currentTime + .08;
  MUS.master.gain.cancelScheduledValues(c.currentTime);
  MUS.master.gain.setValueAtTime(MUS.master.gain.value, c.currentTime);
  MUS.master.gain.linearRampToValueAtTime(MUS.musica === "partida" ? .45 : .6, c.currentTime + .6);
  clearInterval(MUS.timer); MUS.timer = setInterval(agendar, 25); agendar();
}
function musicaParar(rapido) {
  if (!MUS.tocando) return;
  const c = MUS.ctx; MUS.tocando = false;
  MUS.master.gain.cancelScheduledValues(c.currentTime);
  MUS.master.gain.setValueAtTime(MUS.master.gain.value, c.currentTime);
  MUS.master.gain.linearRampToValueAtTime(0, c.currentTime + (rapido ? .15 : .5));
  setTimeout(() => { if (!MUS.tocando) { clearInterval(MUS.timer); MUS.timer = null; } }, rapido ? 200 : 550);
}
function naTelaComMusica() { return !$("app").hidden && TELAS_COM_MUSICA.includes(G.tela); }
setInterval(() => {
  if (!MUS.ctx || typeof musicaDesejada === "function") return;
  if (naTelaComMusica() && somLigado() && MUS.ctx.state === "running") musicaTocar();
  else if (MUS.tocando) musicaParar();
}, 300);
document.addEventListener("visibilitychange", () => { if (document.hidden) musicaParar(true); });

/* efeitos dos botões da tela inicial */
function sfxPop() {
  if (!somLigado()) return; const c = musCtx(); if (!c) return;
  const t = c.currentTime; const o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(1100, t + .07);
  g.gain.setValueAtTime(.25, t); g.gain.exponentialRampToValueAtTime(.0001, t + .12);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + .14);
}
function sfxJogar() {
  if (!somLigado()) return; const c = musCtx(); if (!c) return;
  const t = c.currentTime;
  [67, 71, 74, 79, 83].forEach((m, k) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = hz(m);
    g.gain.setValueAtTime(.0001, t + k * .06); g.gain.exponentialRampToValueAtTime(.12, t + k * .06 + .01); g.gain.exponentialRampToValueAtTime(.0001, t + k * .06 + .22);
    o.connect(g); g.connect(c.destination); o.start(t + k * .06); o.stop(t + k * .06 + .25);
  });
}
document.addEventListener("pointerdown", e => {
  const naLobby = e.target.closest && e.target.closest(".lobby");
  if (!naLobby) return;
  const btn = e.target.closest("button");
  if (btn && btn.dataset.a === "som") return;
  if (somLigado()) { musCtx(); if (naTelaComMusica()) musicaTocar(); }
  if (btn && btn.dataset.a === "jogar") { musicaParar(true); sfxJogar(); }
  else if (btn) sfxPop();
}, true);
acoes.som = () => {
  G.som = !somLigado(); salvar();
  if (G.som) { musCtx(); musicaTocar(); sfxPop(); } else musicaParar(true);
  render();
};
</script>

<script>
/* ================= Música das partidas ================= */
/* Mi menor: Em – C – G – D. Camada calma (chutes) e camada de ação (bola). */
const P_ACORDES = [[52, 55, 59], [48, 52, 55], [55, 59, 62], [50, 54, 57]];
const P_BAIXO = [40, 36, 43, 38];
const P_RIFF = [
  [76, null, 74, 76, null, 79, null, 76, 74, null, 71, null, 74, null, 76, null],
  [76, null, 74, 76, null, 79, null, 81, 79, null, 76, null, 72, null, 74, null],
  [74, null, 71, 74, null, 79, null, 74, 71, null, 67, null, 71, null, 74, null],
  [74, null, 72, 74, null, 78, null, 81, 78, null, 74, null, 78, 79, 81, 83],
];
const ARPEJO = [0, 1, 2, 1, 0, 2, 1, 2];
const TELAS_PARTIDA_JUIZ = ["sorteio", "segredo", "pergunta", "volta", "voto", "novoPerg", "bola", "compra"];
MUS.musica = "lobby";

function tocarPassoPartida(i, t) {
  const compasso = Math.floor(i / 16) % 4, p = i % 16;
  const ac = P_ACORDES[compasso], b = P_BAIXO[compasso];
  const acao = intensidade() === 1;
  if (acao) {
    if (p % 4 === 0) bumbo(t);
    if (p === 4 || p === 12) palma(t);
    chimbal(t, p === 14);
    nota(t, hz(b + (p % 4 === 2 ? 12 : 0)), .16, "sawtooth", .22, { filtro: 700 });
    const r = P_RIFF[compasso][p];
    if (r) nota(t, hz(r), .18, "square", .1, { filtro: 3600 });
    if (p === 0) ac.forEach(m => nota(t, hz(m + 12), .5, "sawtooth", .035, { filtro: 1800, ataque: .03 }));
    if (i % 64 === 63) ruido(t, .4, .22, "highpass", 2500);
  } else {
    if (p === 0 || p === 10) bumbo(t);
    if (p === 8) ruido(t, .05, .16, "bandpass", 2600);
    if (p % 4 === 2) chimbal(t, false);
    if (p === 0 || p === 6 || p === 8) nota(t, hz(b), p === 8 ? .5 : .32, "triangle", .45, { filtro: 600 });
    if (p % 2 === 0) nota(t, hz(ac[ARPEJO[p / 2]] + 12), .22, "triangle", .07, { filtro: 2000 });
    if (p === 0 && compasso % 2 === 0) ac.forEach(m => nota(t, hz(m), 1.6, "sine", .04, { ataque: .25 }));
  }
}
function intensidade() {
  if (!$("arena").hidden) return A.ph && A.ph.k === "bola" ? 1 : 0;
  return G.tela === "bola" ? 1 : 0;
}
function musicaDesejada() {
  if (!$("arena").hidden) return !$("a-game").hidden && !A.fim ? "partida" : null;
  if ($("app").hidden) return null;
  if (TELAS_COM_MUSICA.includes(G.tela)) return "lobby";
  if (TELAS_PARTIDA_JUIZ.includes(G.tela) && G.p && !G.p.fim) return "partida";
  return null;
}

/* troca a música da tela inicial pela das partidas sem mexer no resto */
const _tocarPassoLobby = tocarPasso;
tocarPasso = function (i, t) { if (MUS.musica === "partida") tocarPassoPartida(i, t); else _tocarPassoLobby(i, t); };
function musicaTrocar(nome) {
  if (!somLigado() || !nome) { if (MUS.tocando) musicaParar(); return; }
  if (MUS.tocando && MUS.musica === nome) return;
  if (MUS.tocando) { MUS.musica = nome; MUS.bpm = nome === "partida" ? 128 : 118; MUS.passo = 0; MUS.proximo = MUS.ctx.currentTime + .05; return; }
  MUS.musica = nome; MUS.bpm = nome === "partida" ? 128 : 118;
  musicaTocar();
}
naTelaComMusica = () => musicaDesejada() === "lobby";
setInterval(() => {
  if (!MUS.ctx || MUS.ctx.state !== "running") return;
  musicaTrocar(musicaDesejada());
}, 250);
document.addEventListener("pointerdown", () => { if (somLigado()) musCtx(); }, true);

function sfxVitoria() {
  if (!somLigado()) { bip(660, .15); setTimeout(() => bip(990, .3), 160); return; }
  const c = musCtx(); if (!c) return;
  const t = c.currentTime + .05;
  const tocar = (m, ini, dur, vol) => {
    const o = c.createOscillator(), g = c.createGain(); o.type = "square"; o.frequency.value = hz(m);
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 3000;
    g.gain.setValueAtTime(.0001, t + ini); g.gain.exponentialRampToValueAtTime(vol, t + ini + .01); g.gain.exponentialRampToValueAtTime(.0001, t + ini + dur);
    o.connect(f); f.connect(g); g.connect(c.destination); o.start(t + ini); o.stop(t + ini + dur + .05);
  };
  [[67, 0], [67, .12], [67, .24], [72, .36]].forEach(([m, d]) => tocar(m, d, .14, .14));
  [[72, .6], [76, .6], [79, .6], [84, .6]].forEach(([m, d]) => tocar(m, d, 1.2, .08));
}

/* botão de som dentro das partidas */
function botaoSom() {
  return `<button class="som-mini" data-a="som" type="button" aria-label="${somLigado() ? "Desligar o som" : "Ligar o som"}">${somLigado() ? "🔊" : "🔇"}</button>`;
}

topo = titulo => _topo(titulo).replace('<span class="clock"', botaoSom() + '<span class="clock"');

acoes.som = el => { _acaoSom(el); atualizarSomArena(); if (G.som !== false) { musCtx(); musicaTrocar(musicaDesejada()); } };
</script>

Object.assign(acoes, {

});

<script>
/* ================= Online: cada um no seu celular =================
   O celular de quem cria a sala ("anfitrião") roda a partida e manda o estado para os outros.
   Os outros mandam só o que fazem: chute, palavra secreta, tiro, movimento, voto, compra e sugestão. */
const ON = { on: false, host: false, peer: null, code: "", sala: [], robos: 2, fp: true, timer: null, hostConn: null, myIdx: 0,
  meuNome: "", salaNomes: [], pedido: null, esperaTxt: "", actKey: "", fimVisto: false, movT: 0, movUlt: "", conectando: false };
const PREFIXO = "metesarrafo-v1-";
const SALA_DO_ANDRE = "ANDREK7Q";   // código fixo: é o que está no QR impresso (materiais/)
const onHost = () => ON.on && ON.host;
const onCli = () => ON.on && !ON.host;
function gerarCodigo() { const L = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = ""; for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random() * L.length)]; return c; }
function linkSala(code) { return location.origin + location.pathname + "?sala=" + code; }
function enviar(conn, msg) { try { if (conn && conn.open) conn.send(msg); } catch {} }
function agir(msg) { if (onHost()) entrada(A.P[ON.myIdx], msg); else if (ON.hostConn) enviar(ON.hostConn, msg); }
TELAS_COM_MUSICA.push("salaHost", "esperando", "entrar", "criandoSala");

/* ---------- Anfitrião: criar sala ---------- */
function usarSalaFixa() { return G.salaFixa ?? (perfil().toLowerCase() === "andre"); }
/* auto: nome de quem chegou pelo QR e achou a sala fechada; essa pessoa abre a sala */
function criarSala(fixa = usarSalaFixa(), auto = null) {
  if (typeof Peer === "undefined") { toast("A conexão online não carregou. Confira a internet."); return; }
  if (ON.peer) { try { ON.peer.destroy(); } catch {} }
  ON.host = true; ON.on = false; ON.code = fixa ? SALA_DO_ANDRE : gerarCodigo(); ON.sala = [];
  const peer = new Peer(PREFIXO + ON.code, { debug: 0 });
  ON.peer = peer;
  ir("criandoSala");
  peer.on("open", () => {
    if (G.tela === "criandoSala") ir("salaHost");
    if (auto) toast("A sala estava fechada, então você abriu! Chame a turma e toque em Começar.");
  });
  peer.on("error", e => {
    if (e.type === "unavailable-id" && auto) { entrarSala(ON.code, auto, true); return; }   // alguém abriu ao mesmo tempo
    if (e.type === "unavailable-id") {
      if (fixa) { toast("A Sala do Andre já está aberta. Entrando nela…"); ON.codeEntrar = SALA_DO_ANDRE; entrarSala(SALA_DO_ANDRE, perfil(), true); return; }
      criarSala(false); return;
    }
    if (e.type === "peer-unavailable") return;
    toast("Problema na conexão: " + e.type);
    if (G.tela === "criandoSala") ir("lobby");
  });
  peer.on("connection", conn => {
    conn.on("data", d => hostRecebe(conn, d));
    conn.on("close", () => hostSaiu(conn));
    conn.on("error", () => hostSaiu(conn));
  });
}
function enviarSala() {
  const nomes = [perfil(), ...ON.sala.map(s => s.nome)];
  const codigos = { [perfil()]: meuCodigoAmigo() }; ON.sala.forEach(s => { if (s.codigo) codigos[s.nome] = s.codigo; });
  ON.sala.forEach(s => enviar(s.conn, { t: "sala", nomes, robos: ON.robos, code: ON.code, codigos }));
}
TELAS.criandoSala = () => `
  <section data-fundo="${fundoAtual()}" class="bgf lobby"><h1 class="lb-title" style="font-size:40px">Criando sala…</h1><p class="lb-sub">Conectando ao servidor.</p>
  <button class="lb-pill" data-a="encerrarSala" style="align-self:center">Cancelar</button></section>`;
TELAS.salaHost = () => {
  const total = 1 + ON.sala.length + ON.robos;
  const ok = total >= 3 && total <= 20;
  depoisFn = () => {
    const box = $("qr-sala"); if (!box) return; box.innerHTML = "";
    try { new QRCode(box, { text: linkSala(ON.code), width: 400, height: 400, colorDark: "#0f3057", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }); } catch { box.textContent = ON.code; }
  };
  return `
  <section data-fundo="${fundoAtual()}" class="bgf lobby" aria-label="Sala online">
    <div class="lb-top"><button class="lb-pill" data-a="encerrarSala">← Fechar sala</button><span class="lb-pill">Sala <b style="font-family:var(--display);font-size:20px;margin-left:6px">${esc(ON.code)}</b></span></div>
    <h1 class="lb-title" style="font-size:38px">Chame os amigos</h1>
    <p class="lb-sub">Eles escaneiam o QR code ou abrem o link no celular deles. Ninguém precisa de conta.</p>
    ${ON.sala.length ? "" : `<button class="lb-cont" data-a="trocarSala">${ON.code === SALA_DO_ANDRE ? "Usar um código sorteado" : "Usar a Sala do Andre (QR impresso)"}</button>`}
    <div class="qr" id="qr-sala" role="img" aria-label="QR code da sala"></div>
    <div class="url" style="color:#fff">${esc(linkSala(ON.code))}</div>
    <div class="card" style="background:rgba(11,27,51,.6)">
      <h3>Na sala (${1 + ON.sala.length} ${1 + ON.sala.length === 1 ? "pessoa" : "pessoas"})</h3>
      <div class="chips"><span class="chip">${esc(perfil())} (você)</span>${ON.sala.map(s => `<span class="chip">${esc(s.nome)}</span>`).join("")}</div>
      ${ON.sala.length ? "" : `<p class="dim">Esperando os amigos entrarem…</p>`}
      <h3>Robôs</h3>
      <div class="stepper"><button class="btn ghost" type="button" data-a="robosMenos" aria-label="Menos um robô">−</button><b>${ON.robos}</b><button class="btn ghost" type="button" data-a="robosMais" aria-label="Mais um robô">+</button></div>
      <h3>Sua visão</h3>
      <span class="seg2" role="group" aria-label="Visão do jogo" style="align-self:flex-start">
        <button type="button" data-a="visaoFp" aria-pressed="${ON.fp !== false}">1ª pessoa</button><button type="button" data-a="visaoCima" aria-pressed="${ON.fp === false}">De cima</button>
      </span>
      <p class="dim" style="font-size:14px">Total: ${total} jogadores (de 3 a 20). Cada amigo escolhe a visão no celular dele.</p>
    </div>
    <button class="lb-jogar" data-a="comecarOnline" ${ok ? "" : "disabled"} style="flex:none;min-height:70px">${ok ? "Começar" : "Precisa de 3"}</button>
  </section>`;
};
Object.assign(acoes, {
  encerrarSala() { encerrarOnline(); },
  trocarSala() { const fixa = ON.code !== SALA_DO_ANDRE; G.salaFixa = fixa; salvar(); criarSala(fixa); },
  robosMenos() { ON.robos = Math.max(0, ON.robos - 1); enviarSala(); render(); },
  robosMais() { if (1 + ON.sala.length + ON.robos < 20) ON.robos++; enviarSala(); render(); },
  visaoFp() { guardarDigitado(); ON.fp = true; G.visaoOnline = true; salvar(); render(); },
  visaoCima() { guardarDigitado(); ON.fp = false; G.visaoOnline = false; salvar(); render(); },
  comecarOnline() { comecarOnline(); },
});
function guardarDigitado() { const n = $("en-nome"), c = $("en-code"); if (n) ON.nomeDigitado = n.value; if (c) ON.codeDigitado = c.value; }
function hostRecebe(conn, d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "hello") {
    if (ON.on) { enviar(conn, { t: "fora", msg: "A partida já começou. Espere a próxima rodada e entre de novo." }); return; }
    if (1 + ON.sala.length + ON.robos >= 20) { enviar(conn, { t: "fora", msg: "A sala está cheia." }); return; }
    if (ON.sala.some(s => s.conn === conn)) return;
    const base = String(d.nome || "Amigo").replace(/\s+/g, " ").trim().slice(0, 20) || "Amigo";
    const usados = [perfil(), ...ON.sala.map(s => s.nome)];
    let nome = base, k = 2; while (usados.some(u => u.toLowerCase() === nome.toLowerCase())) nome = base + " " + (k++);
    ON.sala.push({ conn, nome, moedas: Math.max(0, +d.moedas || 0), vidasInv: Math.max(0, Math.floor(+d.vidas || 0)), skin: skinInfo(d.skin).k, ficha: limparFicha(d.ficha), codigo: limparCodigoAmigo(d.amigo) });
    enviar(conn, { t: "bemvindo", nome, code: ON.code });
    enviarSala(); toast(`${nome} entrou na sala`); bip(880, .08);
    if (G.tela === "salaHost") render();
    return;
  }
  if (!ON.on) return;
  const p = A.P.find(q => q.conn === conn);
  if (p) entrada(p, d);
}
function hostSaiu(conn) {
  if (!ON.host) return;
  if (!ON.on) {
    const s = ON.sala.find(x => x.conn === conn); if (!s) return;
    ON.sala = ON.sala.filter(x => x.conn !== conn); enviarSala(); toast(`${s.nome} saiu da sala`);
    if (G.tela === "salaHost") render();
    return;
  }
  const p = A.P.find(q => q.conn === conn); if (!p || !p.remoto) return;
  p.remoto = false; p.humano = false; p.conn = null; p.ctrl = false;
  if (p.vivo && p.modo !== "casa" && p.modo !== "mira") { p.alvo = { ...p.home }; p.modo = "voltando"; }
  toast(`${p.nome} saiu. Um robô joga no lugar.`);
  const ph = A.ph || {};
  if (ON.pedido && ON.pedido.idx === p.i) {
    const tipo = ON.pedido.tipo; ON.pedido = null; ON.esperaTxt = ""; fecharOv();
    if (tipo === "segredo") novaPalavraA(p); else eliminarA(p);
  }
  if (ph.k === "pergunta" && ph.ordem[ph.idx] === p) ph.pensa = 1;
}

/* ---------- Anfitrião: começar ---------- */
function comecarOnline() {
  const lista = [{ nome: perfil(), local: true }].concat(ON.sala.filter(s => s.conn.open).map(s => ({ nome: s.nome, conn: s.conn, moedas: s.moedas, vidasInv: s.vidasInv, skin: s.skin, ficha: s.ficha })));
  for (let k = 1; k <= ON.robos; k++) lista.push({ nome: "Robô " + k, robo: true });
  if (lista.length < 3) { toast("Precisa de pelo menos 3 jogadores"); return; }
  const n = lista.length;
  A.cfg = { ...G.cfg };
  A.P = lista.map((o, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    const home = { x: AC + AH * Math.cos(a), y: AC + AH * Math.sin(a) };
    return { i, nome: o.nome, humano: !o.robo, remoto: !!o.conn, conn: o.conn || null, vidasInv: o.vidasInv || 0, mov: { x: 0, y: 0 },
      cor: A_CORES[i % A_CORES.length], pele: A_PELE[i % A_PELE.length],
      vidas: A.cfg.vidas, vivo: true, moedas: 0, guardado: o.robo ? 0 : o.local ? (G.banco[o.nome] || 0) : (o.moedas || 0), ganho: 0, compradas: 0,
      home, x: home.x, y: home.y, alvo: null, modo: "casa", vel: A_VEL * aRnd(.88, 1.12), habil: aRnd(-.08, .08),
      flash: 0, passo: 0, ctrl: false, tocou: false, saiuEm: null };
  });
  A.P.forEach((p, i) => { if (!p.humano) return; vestir(p, lista[i].local ? skinDe(p.nome) : lista[i].skin); const f = lista[i].local ? personagemDe(p.nome) : lista[i].ficha; if (f) p.ficha = f; });
  A.cel = 0; ON.myIdx = 0; A.balls = []; A.fx = []; A.t = 0; A.fim = null; A.ptr = null; A.inicio = Date.now();
  A.st = { palavras: 0, acertos: 0, erros: 0, timeouts: 0, votos: 0, votosOk: 0, arremessos: 0, acertosBola: 0, rodadas: 0, compras: 0, moedas: {}, eventos: [] };
  ON.on = true; ON.pedido = null; ON.esperaTxt = ""; ON.fimVisto = false;
  $("app").hidden = true; $("arena").hidden = false; $("a-setup").hidden = true; $("a-game").hidden = false;
  window.scrollTo(0, 0);
  const estatico = A.P.map(p => ({ nome: p.nome, cor: p.cor, pele: p.pele, skin: p.skin || "classico", ficha: p.ficha || null, humano: p.humano, hx: Math.round(p.home.x), hy: Math.round(p.home.y) }));
  A.P.forEach(p => { if (p.conn) enviar(p.conn, { t: "start", P: estatico, eu: p.i, cfg: A.cfg }); });
  A.fp = false;
